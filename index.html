<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,600&family=Nunito:wght@500;700&display=swap">
<style>
:root{--bg:#fff7f9;--card:#fff;--ink:#3a2a31;--mute:#8d7480;--pri:#d9507f;--line:#f0dbe3;--cell:#fdf0f4;--x:#d9507f;--o:#5a7be0;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1418;--card:#281c22;--ink:#f6e9ee;--mute:#b79aa7;--pri:#ee6c98;--line:#3d2b34;--cell:#33232b;--x:#ee6c98;--o:#8fb0ff;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1c1418;--card:#281c22;--ink:#f6e9ee;--mute:#b79aa7;--pri:#ee6c98;--line:#3d2b34;--cell:#33232b;--x:#ee6c98;--o:#8fb0ff;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}
main{max-width:460px;margin:0 auto;padding:24px 16px 40px}
h1{font-size:26px;margin:8px 0 2px;text-align:center}
.sub{text-align:center;color:var(--mute);margin:0 0 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;margin-bottom:14px}
label{display:block;font-size:13px;color:var(--mute);margin:12px 0 5px}
input{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;outline:none}
input:focus{border-color:var(--pri)}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:12px 16px;background:var(--pri);color:#fff;font-weight:600}
button.ghost{background:var(--cell);color:var(--ink)}
button:disabled{opacity:.5}
#go{margin-top:8px}
.games{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g{background:var(--cell);border:2px solid transparent;color:var(--ink);text-align:center;padding:14px 8px}
.g.sel{border-color:var(--pri)}
.g span{display:block;font-size:28px;margin-bottom:2px}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between}
.pill{background:var(--cell);padding:5px 12px;border-radius:99px;font-size:13px}
#gname{font-weight:600}
.status{text-align:center;font-weight:600;margin:14px 0;min-height:24px}
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:320px;margin:0 auto}
.cell{aspect-ratio:1;font-size:40px;font-weight:700;background:var(--cell);border:2px solid transparent;color:var(--ink);padding:0;border-radius:16px;line-height:1}
.cell.X{color:var(--x)}.cell.O{color:var(--o)}
.cell.W{border-color:var(--pri)}
.err{color:var(--pri);text-align:center;font-size:14px;min-height:20px;margin:8px 0 0}
.hide{display:none}
.seg{display:flex;gap:8px}.seg button{flex:1;padding:10px 4px;font-size:14px}
.oc-top{display:flex;justify-content:space-between;gap:6px;flex-wrap:wrap}
.oc-letter{font-family:"Playfair Display",Georgia,serif;font-size:84px;text-align:center;color:var(--pri);text-shadow:0 0 22px var(--glow);line-height:1.1;margin:6px 0}
.ocf{margin:8px 0}.ocf .l{display:flex;justify-content:space-between;font-size:13px;color:var(--mute);margin:0 4px 3px}
.oct{width:100%;border-collapse:collapse;font-size:14px}.oct td,.oct th{padding:7px 4px;border-bottom:1px solid var(--line);text-align:center}.oct td:first-child{text-align:left;color:var(--mute)}
.oct select.adj{width:auto;padding:2px 4px;font-size:13px;font-weight:700;border-radius:8px;border:1px solid var(--line);background:var(--cell);color:var(--ink);margin:0}
.pts{color:var(--pri);font-weight:700}.bad{text-decoration:line-through;opacity:.6}
.oc-scores{display:flex;justify-content:space-around;font-size:24px;text-align:center;margin:10px 0}
.wc{display:flex;gap:10px;align-items:baseline;padding:7px 12px;border-radius:14px;font-size:18px;margin:4px 0;background:var(--cell);text-transform:capitalize}
.wc span{width:16px;color:var(--mute);font-size:12px}.wc.on{color:var(--pri);font-weight:700}
.wc.cur{border:1px solid var(--pri);box-shadow:0 0 14px -4px var(--glow)}
.wpick input{margin:3px 0;padding:10px}
.ulin{text-align:center;font-size:30px;margin:10px 0 4px}
.ulh{padding:6px 2px;border-bottom:1px solid var(--line);font-size:14px}.ulh:first-child{font-size:17px}
.invite{text-align:center;margin:14px 0 4px}
.lbl{font-size:12px;letter-spacing:.15em;text-transform:uppercase;color:var(--mute)}
.bigcode{font-family:"Playfair Display",Georgia,serif;font-size:42px;letter-spacing:.18em;color:var(--pri);text-shadow:0 0 18px var(--glow)}
:root{--bg1:#ffe4ee;--bg2:#e8d9ff;--bg3:#ffd9c9;--card:rgba(255,255,255,.62);--ink:#4a2340;--mute:#8d6a86;--pri:#e8457f;--pri2:rgba(232,69,127,.14);--line:rgba(255,255,255,.9);--cell:rgba(255,255,255,.55);--x:#e8457f;--o:#8a5cf0;--glow:rgba(232,69,127,.35)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#1b1033;--bg2:#3a1745;--bg3:#12123a;--card:rgba(255,255,255,.08);--ink:#fff0f6;--mute:#d3a9c8;--pri:#ff6fa5;--pri2:rgba(255,111,165,.18);--line:rgba(255,255,255,.18);--cell:rgba(255,255,255,.08);--x:#ff7fb0;--o:#b79bff;--glow:rgba(255,111,165,.45)}}
:root[data-theme="dark"]{--bg1:#1b1033;--bg2:#3a1745;--bg3:#12123a;--card:rgba(255,255,255,.08);--ink:#fff0f6;--mute:#d3a9c8;--pri:#ff6fa5;--pri2:rgba(255,111,165,.18);--line:rgba(255,255,255,.18);--cell:rgba(255,255,255,.08);--x:#ff7fb0;--o:#b79bff;--glow:rgba(255,111,165,.45)}
body{font-family:Nunito,system-ui,-apple-system,sans-serif;background:linear-gradient(160deg,var(--bg1),var(--bg2) 55%,var(--bg3));background-attachment:fixed;position:relative;overflow-x:hidden}
.sky{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
main{position:relative;z-index:1}
.fl{position:absolute;bottom:-40px;opacity:0;animation:rise linear infinite;filter:drop-shadow(0 0 6px var(--glow))}
@keyframes rise{0%{transform:translateY(0) translateX(0) scale(.7);opacity:0}15%{opacity:.7}80%{opacity:.5}100%{transform:translateY(-110vh) translateX(30px) scale(1.1);opacity:0}}
h1{font-family:"Playfair Display",Georgia,serif;font-style:italic;font-weight:600;font-size:40px;margin:14px 0 4px;background:linear-gradient(90deg,var(--pri),var(--o),var(--pri));background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 6s linear infinite}
@keyframes shine{to{background-position:200% center}}
.sub{font-size:15px;letter-spacing:.04em}
.beat{display:inline-block;animation:beat 1.6s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.25)}30%{transform:scale(1)}45%{transform:scale(1.18)}}
.card{background:var(--card);border:1px solid var(--line);border-radius:26px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 10px 40px -12px var(--glow);padding:20px}
input{border-radius:16px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
button{border-radius:999px;background:linear-gradient(135deg,var(--pri),#ff8fb8);box-shadow:0 6px 18px -6px var(--glow);transition:transform .15s}
button:active{transform:scale(.96)}
button.ghost{background:var(--pri2);color:var(--ink);box-shadow:none}
.g{border-radius:20px;background:var(--card);border:2px solid var(--line);color:var(--ink);box-shadow:none}
.g.sel{border-color:var(--pri);box-shadow:0 0 22px -4px var(--glow)}
.pill{background:var(--pri2);border-radius:999px}
.cell{border-radius:22px;background:var(--card);border:2px solid var(--line);box-shadow:none;color:var(--ink)}
.cell.X{color:var(--x);text-shadow:0 0 14px var(--glow);animation:pop .3s}
.cell.O{color:var(--o);text-shadow:0 0 14px var(--glow);animation:pop .3s}
.cell.W{box-shadow:0 0 24px var(--glow)}

.rps-word span:nth-child(2){animation-delay:.5s}.rps-word span:nth-child(3){animation-delay:1s}
.rps-res{font-family:"Playfair Display",Georgia,serif;font-style:italic;font-weight:600;font-size:26px;color:var(--pri);animation:up .5s .15s both}

.rps-again{margin-top:14px;width:100%}
@keyframes rpsBreath{50%{transform:scale(1.06)}}
@keyframes rpsBob{0%,100%{transform:translateY(0) rotate(calc(var(--d) * -6deg))}30%{transform:translateY(-24px) rotate(calc(var(--d) * 14deg))}60%{transform:translateY(8px) rotate(calc(var(--d) * -4deg))}}
@keyframes rpsPop{0%{transform:scale(.2) rotate(-25deg);opacity:0}60%{transform:scale(1.18) rotate(6deg);opacity:1}100%{transform:none}}
@keyframes rpsPopW{0%{transform:scale(.2) rotate(-25deg);opacity:0}60%{transform:scale(1.28) rotate(6deg);opacity:1}100%{transform:scale(1.1)}}
@keyframes rpsPopL{0%{transform:scale(.2) rotate(25deg);opacity:0}60%{transform:scale(1.1);opacity:1}100%{transform:scale(.9);opacity:.5}}
@keyframes rpsGlow{50%{box-shadow:0 0 0 7px transparent,0 16px 40px -8px var(--glow)}}
@keyframes rpsSp{0%{transform:rotate(var(--a)) translateY(-30px) scale(1);opacity:1}100%{transform:rotate(var(--a)) translateY(-78px) scale(.2);opacity:0}}
@keyframes rpsFlash{0%{opacity:0}25%{opacity:1}100%{opacity:0}}

<body>
<div class="sky" id="sky"></div>
<main>
  <button class="mute" id="mute" aria-label="Sound on/off"></button>
  <div class="brand"><svg viewBox="0 0 24 24" width="42" height="42"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff6fa5"/><stop offset="1" stop-color="#8a5cf0"/></linearGradient></defs><path fill="url(#lg)" d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 5 6.3 5c2 0 3.6 1.1 4.4 2.6h.6C12.1 6.1 13.7 5 15.7 5 19 5 21.1 8.4 19.6 11.8 17.5 16.4 12 21 12 21z"/></svg><h1>Our Little Arcade</h1></div>
  <p class="sub">Games for two, just us </p>

  <section id="lobby">
    <div class="card">
      <div id="v-home">
        <label for="name">Your name</label>
        <input id="name" maxlength="20" placeholder="e.g. Alex" autocomplete="off">
        <div style="display:flex;flex-direction:column;gap:10px;margin-top:18px">
          <button id="mk-open"> Create a room</button>
          <button class="ghost" id="jn-open"> Join a room</button>
        </div>
      </div>
      <div id="v-create" class="hide">
        <label>Choose a game</label>
        <div class="games" id="gamelist"></div>
        <div id="opts" class="hide">
          <div id="o-oc"><label>Rounds</label><div class="seg" id="seg-rounds"></div>
          <label>Letters</label><div class="seg" id="seg-lang"></div></div>
          <div id="o-wc"><label>Words in the chain</label><div class="seg" id="seg-words"></div></div>
        </div>
        <button id="mk" style="width:100%;margin-top:16px">Create room</button>
        <button class="ghost" data-back style="width:100%;margin-top:8px">← Back</button>
      </div>
      <div id="v-join" class="hide">
        <label for="code">Enter the room code</label>
        <input id="code" maxlength="12" autocapitalize="characters" autocomplete="off" placeholder="ABCDE" style="text-align:center;font-size:24px;letter-spacing:.2em;text-transform:uppercase">
        <button id="go" style="width:100%;margin-top:16px">Join room</button>
        <button class="ghost" data-back style="width:100%;margin-top:8px">← Back</button>
      </div>
      <p class="err" id="err"></p>
    </div>
  </section>

  <section id="room" class="hide">
    <div class="card">
      <div class="row"><span class="pill" id="rcode"></span><span id="gname"></span><button class="ghost" id="leave">Leave</button></div>
      <div class="players" id="players"></div>
      <div class="invite"><div class="lbl">Room code</div><div class="bigcode" id="bigcode"></div></div>
      <div class="status" id="status"></div>
      <div id="stage"></div>
      <div class="row" style="margin-top:14px;justify-content:center;gap:10px">
        <button class="ghost" id="again">New round</button>
        <button class="ghost" id="copy">Copy invite link</button>
      </div>
    </div>
  </section>
</main>

<script>
/* ===== GAME REGISTRY — add new games here ===== */
const LINES=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
const OC={key:null,draft:{},written:false,timer:null,ans:null,played:null};
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const CATS=[["boy","Boy","ولد"],["girl","Girl","بنت"],["plant","Plant","نبات"],["animal","Animal","حيوان"],["thing","Thing","جماد"],["country","Country","بلاد"]];
const norm=s=>(s||"").trim().toLowerCase().replace(/[\u064B-\u065F\u0670\u0640]/g,"").replace(/[أإآٱ]/g,"ا").replace(/ى/g,"ي").replace(/ة/g,"ه").replace(/\s+/g," ");
const stripAl=n=>n.startsWith("ال")&&n.length>2?n.slice(2):n;
const okLetter=(a,L)=>{const n=norm(a),l=norm(L);return !!n&&(n.startsWith(l)||stripAl(n).startsWith(l))};
function ocScore(a0,a1,L){return CATS.map(([k])=>{const x=(a0||{})[k]||"",y=(a1||{})[k]||"",v0=okLetter(x,L),v1=okLetter(y,L);let p0=0,p1=0;
  if(v0&&v1){const same=stripAl(norm(x))===stripAl(norm(y));p0=p1=same?5:10}else if(v0)p0=10;else if(v1)p1=10;
  return{k,x,y,v0,v1,p0,p1}})}
const GAMES={
  oc:{
    name:"Otobis Complete",emoji:"Aa",desc:"Race to fill 6 words that start with the same letter",
    init(o){o=o||{};const rounds=o.rounds||3,lang=o.lang||"en";
      const pool=(lang==="ar"?"ابتجحخدرزسشصطعغفقكلمنهوي":"ABCDEFGHIJKLMNOPRSTW").split("");
      for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}
      return{opts:{rounds,lang},sid:Math.random().toString(36).slice(2,8),letters:pool.slice(0,rounds),round:0,phase:"play",by:null,scores:[0,0],win:null,adj:null};
    },
    render(stage,s,ctx){
      clearInterval(OC.timer);
      const L=s.letters[s.round],key=s.sid+"_"+s.round,N=ctx.names;
      if(OC.key!==key){OC.key=key;OC.draft={};OC.written=false}
      const head='<div class="oc-top"><span class="pill">Round '+Math.min(s.round+1,s.opts.rounds)+'/'+s.opts.rounds+'</span><span class="pill">'+esc(N[0])+' '+s.scores[0]+' · '+esc(N[1])+' '+s.scores[1]+'</span></div>';
      if(s.phase==="done"){
        stage.dataset.k="";
        const w=s.win==="draw"?"It's a tie! ":esc(N[s.win])+" wins! ";
        stage.innerHTML=head+'<div class="oc-letter" style="font-size:40px">'+w+'</div><div class="oc-scores"><div><b>'+esc(N[0])+'</b><br>'+s.scores[0]+'</div><div><b>'+esc(N[1])+'</b><br>'+s.scores[1]+'</div></div>';
        return;
      }
      if(s.phase==="play"){
        if(stage.dataset.k===key+"p")return;
        stage.dataset.k=key+"p";
        stage.innerHTML=head+'<div class="oc-letter">'+esc(L)+'</div>';
        const f=document.createElement("div");
        CATS.forEach(([k,en,ar])=>{
          const w=document.createElement("div");w.className="ocf";
          w.innerHTML='<span class="l"><span>'+en+'</span><span>'+ar+'</span></span>';
          const i=document.createElement("input");i.dir="auto";i.maxLength=30;i.autocomplete="off";i.placeholder=L+"…";i.value=OC.draft[k]||"";
          i.oninput=()=>{OC.draft[k]=i.value};w.appendChild(i);f.appendChild(w);
        });
        stage.appendChild(f);
        const er=document.createElement("p");er.className="err";stage.appendChild(er);
        const b=document.createElement("button");b.style.width="100%";b.textContent=" Otobis Complete!";
        b.onclick=()=>{if(CATS.some(([k])=>!(OC.draft[k]||"").trim())){er.textContent="Fill all 6 sections first ";return}ctx.move({...s,phase:"scoring",by:ctx.myIdx})};
        stage.appendChild(b);return;
      }
      // scoring phase
      stage.dataset.k="";
      const isHost=ctx.myIdx===0;
      const mk=i=>ctx.db.doc("rooms/"+ctx.code+"/ans/"+s.sid+"_"+s.round+"_"+i);
      if(!OC.written){OC.written=true;mk(ctx.myIdx).set({a:{...OC.draft}}).catch(()=>{OC.written=false})}
      const adj=s.adj||{};
      const results=(a0,a1)=>{
        if(OC.played!==key){OC.played=key;SFX.play("reveal")}
        const rows=ocScore(a0,a1,L);
        // final points per cell: the creator's override if there is one, otherwise the automatic score
        const pt=(i,pl)=>{const o=adj[i+"_"+pl];return(o===0||o===5||o===10)?o:rows[i]["p"+pl]};
        const r0=rows.reduce((t,r,i)=>t+pt(i,0),0),r1=rows.reduce((t,r,i)=>t+pt(i,1),0);
        const cell=(r,i,pl)=>{const x=pl?r.y:r.x,v=pl?r.v1:r.v0,p=pt(i,pl);
          const pts=isHost&&x?'<select class="adj" data-k="'+i+'_'+pl+'" aria-label="Points">'+[10,5,0].map(n=>'<option value="'+n+'"'+(n===p?" selected":"")+'>+'+n+'</option>').join("")+'</select>':'<span class="pts">+'+p+'</span>';
          return '<td><span class="'+(x&&!v?"bad":"")+'">'+(x?esc(x):"—")+'</span> '+pts+'</td>'};
        stage.innerHTML=head+'<div class="oc-letter" style="font-size:48px">'+esc(L)+'</div><table class="oct"><tr><th></th><th>'+esc(N[0])+'</th><th>'+esc(N[1])+'</th></tr>'+
          rows.map((r,i)=>'<tr><td>'+CATS[i][1]+'</td>'+cell(r,i,0)+cell(r,i,1)+'</tr>').join("")+
          '<tr><td><b>Round</b></td><td class="pts">'+r0+'</td><td class="pts">'+r1+'</td></tr></table><p class="sub" style="font-size:12px;margin:8px 0 0">'+
          (isHost?'You\'re the game creator: set each answer to 10, 5 or 0 points.':esc(N[0])+' (game creator) can adjust the points.')+' Default: same answer = 5 · different = 10 · only you = 10 · must start with the letter</p>';
        stage.querySelectorAll("select.adj").forEach(sel=>{sel.onchange=()=>{ctx.move({...s,adj:{...adj,[sel.dataset.k]:parseInt(sel.value,10)}})}});
        const last=s.round+1>=s.opts.rounds;
        if(isHost){
          const nb=document.createElement("button");nb.style.cssText="width:100%;margin-top:14px";nb.textContent=last?"See final result ":"Next round →";
          nb.onclick=()=>{const t=[s.scores[0]+r0,s.scores[1]+r1];ctx.move(last?{...s,scores:t,phase:"done",win:t[0]===t[1]?"draw":t[0]>t[1]?0:1,adj:null}:{...s,scores:t,round:s.round+1,phase:"play",by:null,adj:null})};
          stage.appendChild(nb);
        }else{
          const w=document.createElement("p");w.className="status";w.style.marginTop="14px";w.textContent="Waiting for "+(N[0]||"the game creator")+" to continue…";stage.appendChild(w);
        }
      };

/* ===== Rock Paper Scissors — decides who starts (turn-based games) ===== */
const RPS0=()=>({sid:1,picks:{0:"",1:""},reveal:null,first:null,round:0});
const RPS_L={r:"Rock",p:"Paper",s:"Scissors"};
const RPS_BEAT={r:"s",s:"p",p:"r"};
const rpsWinner=(a,b)=>a===b?"tie":RPS_BEAT[a]===b?0:1;
const SV='<svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">';
const RPS_ICON={
  r:SV+'<path d="M12 38l5-17 14-9 17 4 8 15-4 18-16 6-18-4z" fill="currentColor" fill-opacity=".14"/><path d="M31 33L17 21M31 33l17-17M31 33l25-2M31 33l-19 5M31 33l1 21"/></svg>',
  p:SV+'<path d="M17 8h21l11 11v37H17z" fill="currentColor" fill-opacity=".14"/><path d="M38 8v11h11M24 30h18M24 38h18M24 46h11"/></svg>',
  s:SV+'<circle cx="22" cy="49" r="7" fill="currentColor" fill-opacity=".14"/><circle cx="42" cy="49" r="7" fill="currentColor" fill-opacity=".14"/><path d="M26 43L44 9M38 43L20 9"/><circle cx="32" cy="31" r="1.8" fill="currentColor"/></svg>',
  lock:SV+'<rect x="15" y="28" width="34" height="25" rx="7" fill="currentColor" fill-opacity=".14"/><path d="M22 28v-6a10 10 0 0 1 20 0v6"/></svg>'
};
let RP={sel:"",selSid:null,phase:null,fin:false,handled:null,sawOpen:null,timers:[]};
let lastD=null;
function rpsClear(){RP.timers.forEach(clearTimeout);RP={sel:"",selSid:null,phase:null,fin:false,handled:null,sawOpen:null,timers:[]}}

async function rpsPick(ref,idx,ch){
  await db.runTransaction(async tx=>{
    const s=await tx.get(ref),d=s.data(),r=d.rps||RPS0();
    if(r.reveal||r.first!=null)return;
    const picks={0:(r.picks||{})[0]||"",1:(r.picks||{})[1]||""};
    if(picks[idx])return;
    picks[idx]=ch;
    const upd={["rps.picks."+idx]:ch};
    if(picks[0]&&picks[1]){
      const w=rpsWinner(picks[0],picks[1]);
      upd["rps.reveal"]={picks:[picks[0],picks[1]],w,by:idx,n:r.sid||1};
      if(w!=="tie"){upd["rps.first"]=w;upd["state.turn"]=w}
    }
    tx.update(ref,upd);
  });
}
async function rpsNext(n){
  if(!cur)return;const ref=cur.ref;
  try{await db.runTransaction(async tx=>{
    const d=(await tx.get(ref)).data(),r=d.rps;
    if(!r||(r.sid||1)!==n||r.first!=null)return;
    tx.update(ref,{rps:{sid:n+1,picks:{0:"",1:""},reveal:null,first:null,round:r.round||0}});
  })}catch(e){}
}
function rpsSync(r,me){
  const rv=r.reveal,sid=r.sid||1;
  if(!rv){RP.sawOpen=sid;RP.phase=null;RP.fin=false;return}
  if(RP.handled===rv.n)return;
  RP.handled=rv.n;
  if(RP.sawOpen===rv.n){
    RP.phase="shake";
    const later=(ms,fn)=>RP.timers.push(setTimeout(()=>{fn();if(lastD&&cur)paint(lastD,cur.ref)},ms));
    later(1650,()=>{RP.phase="show";SFX.play(rv.w==="tie"?"reveal":rv.w===me?"win":"lose");if(rv.w===me)burst()});
    if(rv.w==="tie"){RP.timers.push(setTimeout(()=>{if(rv.by===me)rpsNext(rv.n)},4200))}
    else later(4400,()=>{RP.fin=true});
  }else{RP.phase="show";if(rv.w!=="tie")RP.fin=true}
}
function rpsStatus(r,me,N){
  const rv=r.reveal;
  if(rv){
    if(RP.phase==="shake")return "Rock… Paper… Scissors…";
    if(rv.w==="tie")return "It's a tie — go again!";
    return rv.w===me?"You win! You start this round":N[rv.w]+" wins! "+N[rv.w]+" starts this round";
  }
  return (r.picks||{})[me]?"Waiting for "+N[1-me]+"…":"Rock Paper Scissors — the winner starts";
}
function renderRps(stage,d,r,me,canPlay){
  const N=d.players.map(p=>p.name||"Partner"),opp=1-me,rv=r.reveal,picks=r.picks||{},sid=r.sid||1;
  const ph=rv?(RP.phase||"show"):"pick",mine=picks[me]||"",theirs=picks[opp]||"";
  const key=["rps",sid,ph,mine,theirs?1:0,rv?String(rv.w):"",canPlay?1:0].join("|");
  if(stage.dataset.k===key)return;
  stage.dataset.k=key;
  if(RP.selSid!==sid){RP.selSid=sid;RP.sel=""}
  if(mine)RP.sel=mine;
  const side=i=>{
    const isMe=i===me;let inner,chip,cls;
    if(ph==="pick"){
      const lk=!!picks[i];
      inner=isMe&&lk?RPS_ICON[picks[i]]:lk?RPS_ICON.lock:'<span class="q">?</span>';
      chip=lk?"Locked in ✓":"Choosing…";cls=lk?"lk":"th";
    }else if(ph==="shake"){inner=RPS_ICON.r;chip="Ready…";cls="sh"}
    else{
      const ch=rv.picks[i];inner=RPS_ICON[ch];chip=RPS_L[ch];
      cls=rv.w==="tie"?"tie":rv.w===i?"win":"lose";
    }
    let sp="";
    if(ph==="show"&&rv.w===i)for(let k=0;k<10;k++)sp+='<i class="rps-sp" style="--a:'+(k*36)+'deg"></i>';
    return '<div class="rps-side '+(isMe?"me":"opp")+' '+cls+'" style="--d:'+(isMe?1:-1)+'"><div class="rps-hand">'+inner+sp+'</div><b>'+esc(isMe?"You":N[i])+'</b><span class="rps-chip">'+chip+'</span></div>';
  };
  let h='<div class="rps"><div class="rps-h"><b>Who starts?</b><small>Rock · Paper · Scissors — the winner goes first</small></div>'
    +'<div class="rps-vs">'+(ph==="show"?'<i class="rps-flash"></i>':'')+side(me)+'<span class="rps-mid">VS</span>'+side(opp)+'</div>';
  if(ph==="pick"){
    h+='<div class="rps-pick">'+["r","p","s"].map(c=>'<button class="rps-c'+(RP.sel===c?" sel":"")+'" data-c="'+c+'"'+(!canPlay||mine?" disabled":"")+'>'+RPS_ICON[c]+'<span>'+RPS_L[c]+'</span></button>').join("")+'</div>';
    if(!canPlay)h+='<p class="rps-hint">Waiting for the players…</p>';
    else if(mine)h+='<p class="rps-hint">Locked in — waiting for '+esc(N[opp])+'…</p>';
    else h+='<button class="rps-lock" disabled>Lock in</button>';
  }else if(ph==="shake"){
    h+='<div class="rps-cap rps-word"><span>Rock</span><span>Paper</span><span>Scissors</span></div>';
  }else if(rv.w==="tie"){
    h+='<div class="rps-res">It\'s a tie!</div><p class="rps-sub">Same choice — one more try</p><button class="ghost rps-again">Go again</button>';
  }else{
    const nm=rv.w===me?"You":N[rv.w];
    h+='<div class="rps-res">'+esc(nm)+(rv.w===me?" win!":" wins!")+'</div><p class="rps-sub">'+esc(nm)+(rv.w===me?" start":" starts")+' this round</p>';
  }
  h+='</div>';
  stage.innerHTML=h;
  const lock=stage.querySelector(".rps-lock");
  if(lock&&RP.sel)lock.disabled=false;
  stage.querySelectorAll(".rps-c").forEach(b=>b.onclick=()=>{
    if(!canPlay||(picks[me]))return;
    RP.sel=b.dataset.c;SFX.play("tap");
    stage.querySelectorAll(".rps-c").forEach(x=>x.classList.toggle("sel",x===b));
    if(lock)lock.disabled=false;
  });
  if(lock)lock.onclick=()=>{
    if(!RP.sel)return;
    lock.disabled=true;lock.textContent="Locking in…";SFX.play("pop");
    rpsPick(cur.ref,me,RP.sel).catch(()=>{lock.disabled=false;lock.textContent="Lock in"});
  };
  const again=stage.querySelector(".rps-again");
  if(again)again.onclick=()=>{again.disabled=true;rpsNext(rv.n)};
}

function paint(d,ref){
  const g=GAMES[d.game];if(!g)return;
  const code=cur?cur.code:"";
  $("gname").textContent=g.name;
  const myIdx=d.players.findIndex(p=>p.id===uid);
  const names=d.players.map(p=>p.name);
  const ctx={myIdx,names,db,code,move:st=>ref.update({state:st}).catch(()=>{})};
  const two=d.players.length>=2,tb=!!g.turnBased,me=myIdx<0?0:myIdx;
  const rps=tb?(d.rps||RPS0()):null;
  if(tb&&two)rpsSync(rps,me);
  const arena=tb&&two&&(rps.first==null||(!!rps.reveal&&!RP.fin));
  const live=!arena&&d.state.turn!==undefined&&d.state.phase!=="pick"&&d.state.phase!=="done"&&d.state.win==null;
  $("players").innerHTML=d.players.map((p,i)=>'<div class="pl'+(live&&d.state.turn===i?" turn":"")+'"><i style="--h:'+(i?250:340)+'">'+esc((p.name||"?")[0].toUpperCase())+'</i><b>'+esc(p.name)+(i===myIdx?" (you)":"")+'</b></div>').join('<span class="vs">vs</span>')+(d.players.length<2?'<span class="vs">vs</span><div class="pl wait"><i style="--h:250">?</i><b>Waiting…</b></div>':"");
  if(!arena)fx(d,myIdx);
  $("status").textContent=!two?"Waiting for your partner to join… share the code "+code:arena?rpsStatus(rps,me,names):g.status(d.state,ctx);
  $("again").style.display=arena?"none":"";
  if(!two){$("stage").innerHTML="";$("stage").dataset.k="";return}
  const stage=$("stage");
  if(arena){renderRps(stage,d,rps,me,myIdx>=0);return}
  if((stage.dataset.k||"").indexOf("rps|")===0){stage.dataset.k="";stage.innerHTML=""}
  g.render(stage,d.state,ctx);
  if(d.state.win!==null&&d.state.win!=="draw"&&d.state.win===myIdx){if(!celebrated){celebrated=true;burst()}}else if(d.state.win===null)celebrated=false;
  // Rounds alternate: round 1 = RPS winner starts, round 2 = the other player, round 3 = RPS winner again…
  $("again").onclick=()=>{
    const ns=g.init(d.state.opts);
    if(tb&&rps&&rps.first!=null){
      const r=(rps.round||0)+1;
      ns.turn=r%2===0?rps.first:1-rps.first;
      ref.update({state:ns,"rps.round":r}).catch(()=>{});
    }else ref.update({state:ns}).catch(()=>{});
  };
}

function enter(code,ref){
  cur={code,ref};prevD=null;lastD=null;rpsClear();show(true);$("rcode").textContent="Room "+code;$("bigcode").textContent=code;
  $("stage").dataset.k="";
  history.replaceState(null,"","#"+code);
  unsub=ref.onSnapshot(snap=>{
    if(!snap.exists)return;
    lastD=snap.data();paint(lastD,ref);
  },e=>{$("status").textContent="Connection problem: "+(e.message||e.code)});
}

$("leave").onclick=()=>{if(unsub)unsub();unsub=null;cur=null;lastD=null;rpsClear();history.replaceState(null,"","#");show(false)};
$("copy").onclick=async()=>{
  const url=location.href.split("#")[0]+"#"+(cur?cur.code:"");
  const done=t=>{$("copy").textContent=t;setTimeout(()=>$("copy").textContent="Copy invite link",1800)};
  if(navigator.share){try{await navigator.share({title:"Our Arcade",text:"Join my game room "+(cur?cur.code:""),url});return}catch(e){if(e&&e.name==="AbortError")return}}
  try{await navigator.clipboard.writeText(url);done("Copied ✓")}catch(e){window.prompt("Copy this invite link:",url)}
};
let celebrated=false;

function view(id){["v-home","v-create","v-join"].forEach(v=>$(v).classList.toggle("hide",v!==id));$("err").textContent=""}
function needName(){if(!$("name").value.trim()){$("err").textContent="Tell me your name first ";$("name").focus();return false}return true}

const UL={timer:null};
const WN=9,WC={timer:null,sid:null,w:null};
const chnDoc=(ctx,s,i)=>ctx.db.doc("rooms/"+ctx.code+"/chn/"+s.sid+"_"+i);
const ulDoc=(ctx,s,i)=>ctx.db.doc("rooms/"+ctx.code+"/sec/"+s.sid+"_"+i);
let opts={rounds:3,lang:"en",words:9};
function seg(id,items,key){const c=$(id);c.innerHTML="";items.forEach(([v,t])=>{const b=document.createElement("button");b.className="g"+(opts[key]===v?" sel":"");b.textContent=t;b.onclick=()=>{opts[key]=v;[...c.children].forEach(x=>x.classList.remove("sel"));b.classList.add("sel")};c.appendChild(b)})}

function updOpts(){$("opts").classList.toggle("hide",selGame!=="oc"&&selGame!=="wc");$("o-oc").classList.toggle("hide",selGame!=="oc");$("o-wc").classList.toggle("hide",selGame!=="wc")}

let prevD=null;
const SFX=(()=>{let c=null,on=store.get("arcade-mute")!=="1";
 const ac=()=>{if(!c){try{c=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(c&&c.state==="suspended")c.resume();return c};
 const tone=(f,t,d,type,v,sl)=>{const a=ac();if(!a||!on)return;const o=a.createOscillator(),g=a.createGain(),n=a.currentTime+t;o.type=type;o.frequency.setValueAtTime(f,n);if(sl)o.frequency.exponentialRampToValueAtTime(sl,n+d);g.gain.setValueAtTime(0,n);g.gain.linearRampToValueAtTime(v,n+.01);g.gain.exponentialRampToValueAtTime(.0001,n+d);o.connect(g);g.connect(a.destination);o.start(n);o.stop(n+d+.05)};
 const seq=(arr,type,v)=>arr.forEach(x=>tone(x[0],x[1],x[2],type,v));
 const S={tap:()=>tone(520,0,.06,"triangle",.08),pop:()=>tone(660,0,.09,"sine",.15,990),good:()=>seq([[523,0,.12],[659,.1,.12],[784,.2,.2]],"triangle",.16),bad:()=>tone(220,0,.25,"sawtooth",.1,110),turn:()=>seq([[880,0,.1],[1175,.1,.16]],"sine",.12),up:()=>tone(400,0,.18,"triangle",.15,800),down:()=>tone(800,0,.18,"triangle",.15,400),reveal:()=>seq([[392,0,.1],[494,.08,.1],[587,.16,.14]],"sine",.13),horn:()=>seq([[330,0,.18],[262,.16,.3]],"square",.07),join:()=>seq([[660,0,.1],[880,.1,.18]],"sine",.14),win:()=>seq([[523,0,.15],[659,.13,.15],[784,.26,.15],[1047,.39,.35]],"triangle",.18),lose:()=>seq([[392,0,.2],[330,.18,.2],[262,.36,.4]],"sine",.14)};
 return{play(n){try{S[n]&&S[n]()}catch(e){}},toggle(){on=!on;store.set("arcade-mute",on?"0":"1");if(on)S.tap();return on},get on(){return on},unlock:ac,ctx:()=>c}})();
function shake(){const k=document.querySelector("#room .card");if(!k)return;k.classList.remove("shake");void k.offsetWidth;k.classList.add("shake")}
function fx(d,me){const p=prevD,s=d.state;prevD=d;if(!p||p.game!==d.game)return;const q=p.state;
 if(p.players.length<2&&d.players.length>=2)SFX.play("join");
 if(s.win!=null&&q.win==null){SFX.play(s.win==="draw"?"reveal":s.win===me?"win":"lose");return}
 if(d.game==="ttt"&&s.b.filter(Boolean).length>q.b.filter(Boolean).length)SFX.play("pop");
 if(d.game==="ul"&&s.hist.length>q.hist.length){const h=s.hist[s.hist.length-1].h;SFX.play(h==="Higher"?"up":h==="Lower"?"down":"good")}
 if(d.game==="wc"&&s.last&&JSON.stringify(s.last)!==JSON.stringify(q.last||null)){const L=s.last;SFX.play(L.t==="hint"?"reveal":L.ok?"good":"bad");if(L.t==="guess"&&!L.ok&&L.p===me)shake()}
 if(d.game==="oc"&&s.phase==="scoring"&&q.phase==="play")SFX.play("horn");
 const started=q.phase==="pick"&&s.phase==="play";
 if(s.turn===me&&s.phase!=="pick"&&(q.turn!==me||started))SFX.play("turn");
}

let sil=null;
function unmuteIOS(){
  try{if(navigator.audioSession)navigator.audioSession.type="playback"}catch(e){}
  if(sil)return;
  try{const n=4000,b=new Uint8Array(44+n),dv=new DataView(b.buffer),w=(o,t)=>{for(let i=0;i<t.length;i++)b[o+i]=t.charCodeAt(i)};
    w(0,"RIFF");dv.setUint32(4,36+n,true);w(8,"WAVEfmt ");dv.setUint32(16,16,true);dv.setUint16(20,1,true);dv.setUint16(22,1,true);dv.setUint32(24,8000,true);dv.setUint32(28,8000,true);dv.setUint16(32,1,true);dv.setUint16(34,8,true);w(36,"data");dv.setUint32(40,n,true);b.fill(128,44);
    sil=new Audio(URL.createObjectURL(new Blob([b],{type:"audio/wav"})));sil.loop=true;sil.play().catch(()=>{sil=null})}catch(e){sil=null}
}
const startAudio=()=>{unmuteIOS();SFX.unlock()};
