<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Our Arcade</title>
<meta name="theme-color" content="#ffe4ee">
<meta name="apple-mobile-web-app-capable" content="yes">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,600&family=Nunito:wght@500;700&display=swap">
<style>
:root{--bg:#fff7f9;--card:#fff;--ink:#3a2a31;--mute:#8d7480;--pri:#d9507f;--line:#f0dbe3;--cell:#fdf0f4;--x:#d9507f;--o:#5a7be0;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1418;--card:#281c22;--ink:#f6e9ee;--mute:#b79aa7;--pri:#ee6c98;--line:#3d2b34;--cell:#33232b;--x:#ee6c98;--o:#8fb0ff;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1c1418;--card:#281c22;--ink:#f6e9ee;--mute:#b79aa7;--pri:#ee6c98;--line:#3d2b34;--cell:#33232b;--x:#ee6c98;--o:#8fb0ff;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}
main{max-width:460px;margin:0 auto;padding:24px 16px 40px}
h1{font-size:26px;margin:8px 0 2px;text-align:center}
.sub{text-align:center;color:var(--mute);margin:0 0 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;margin-bottom:14px}
label{display:block;font-size:13px;color:var(--mute);margin:12px 0 5px}
input{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;outline:none}
input:focus{border-color:var(--pri)}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:12px 16px;background:var(--pri);color:#fff;font-weight:600}
button.ghost{background:var(--cell);color:var(--ink)}
button:disabled{opacity:.5}
#go{margin-top:8px}
.games{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g{background:var(--cell);border:2px solid transparent;color:var(--ink);text-align:center;padding:14px 8px}
.g.sel{border-color:var(--pri)}
.g span{display:block;font-size:28px;margin-bottom:2px}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between}
.pill{background:var(--cell);padding:5px 12px;border-radius:99px;font-size:13px}
#gname{font-weight:600}
.status{text-align:center;font-weight:600;margin:14px 0;min-height:24px}
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:320px;margin:0 auto}
.cell{aspect-ratio:1;font-size:40px;font-weight:700;background:var(--cell);border:2px solid transparent;color:var(--ink);padding:0;border-radius:16px;line-height:1}
.cell.X{color:var(--x)}.cell.O{color:var(--o)}
.cell.W{border-color:var(--pri)}
.err{color:var(--pri);text-align:center;font-size:14px;min-height:20px;margin:8px 0 0}
.hide{display:none}
.seg{display:flex;gap:8px}.seg button{flex:1;padding:10px 4px;font-size:14px}
.oc-top{display:flex;justify-content:space-between;gap:6px;flex-wrap:wrap}
.oc-letter{font-family:"Playfair Display",Georgia,serif;font-size:84px;text-align:center;color:var(--pri);text-shadow:0 0 22px var(--glow);line-height:1.1;margin:6px 0}
.ocf{margin:8px 0}.ocf .l{display:flex;justify-content:space-between;font-size:13px;color:var(--mute);margin:0 4px 3px}
.oct{width:100%;border-collapse:collapse;font-size:14px}.oct td,.oct th{padding:7px 4px;border-bottom:1px solid var(--line);text-align:center}.oct td:first-child{text-align:left;color:var(--mute)}
.pts{color:var(--pri);font-weight:700}.bad{text-decoration:line-through;opacity:.6}
.oc-scores{display:flex;justify-content:space-around;font-size:24px;text-align:center;margin:10px 0}
.wc{display:flex;gap:10px;align-items:baseline;padding:7px 12px;border-radius:14px;font-size:18px;margin:4px 0;background:var(--cell);text-transform:capitalize}
.wc span{width:16px;color:var(--mute);font-size:12px}.wc.on{color:var(--pri);font-weight:700}
.wc.cur{border:1px solid var(--pri);box-shadow:0 0 14px -4px var(--glow)}
.wpick input{margin:3px 0;padding:10px}
.ulin{text-align:center;font-size:30px;margin:10px 0 4px}
.ulh{padding:6px 2px;border-bottom:1px solid var(--line);font-size:14px}.ulh:first-child{font-size:17px}
.invite{text-align:center;margin:14px 0 4px}
.lbl{font-size:12px;letter-spacing:.15em;text-transform:uppercase;color:var(--mute)}
.bigcode{font-family:"Playfair Display",Georgia,serif;font-size:42px;letter-spacing:.18em;color:var(--pri);text-shadow:0 0 18px var(--glow)}
:root{--bg1:#ffe4ee;--bg2:#e8d9ff;--bg3:#ffd9c9;--card:rgba(255,255,255,.62);--ink:#4a2340;--mute:#8d6a86;--pri:#e8457f;--pri2:rgba(232,69,127,.14);--line:rgba(255,255,255,.9);--cell:rgba(255,255,255,.55);--x:#e8457f;--o:#8a5cf0;--glow:rgba(232,69,127,.35)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#1b1033;--bg2:#3a1745;--bg3:#12123a;--card:rgba(255,255,255,.08);--ink:#fff0f6;--mute:#d3a9c8;--pri:#ff6fa5;--pri2:rgba(255,111,165,.18);--line:rgba(255,255,255,.18);--cell:rgba(255,255,255,.08);--x:#ff7fb0;--o:#b79bff;--glow:rgba(255,111,165,.45)}}
:root[data-theme="dark"]{--bg1:#1b1033;--bg2:#3a1745;--bg3:#12123a;--card:rgba(255,255,255,.08);--ink:#fff0f6;--mute:#d3a9c8;--pri:#ff6fa5;--pri2:rgba(255,111,165,.18);--line:rgba(255,255,255,.18);--cell:rgba(255,255,255,.08);--x:#ff7fb0;--o:#b79bff;--glow:rgba(255,111,165,.45)}
body{font-family:Nunito,system-ui,-apple-system,sans-serif;background:linear-gradient(160deg,var(--bg1),var(--bg2) 55%,var(--bg3));background-attachment:fixed;position:relative;overflow-x:hidden}
.sky{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
main{position:relative;z-index:1}
.fl{position:absolute;bottom:-40px;opacity:0;animation:rise linear infinite;filter:drop-shadow(0 0 6px var(--glow))}
@keyframes rise{0%{transform:translateY(0) translateX(0) scale(.7);opacity:0}15%{opacity:.7}80%{opacity:.5}100%{transform:translateY(-110vh) translateX(30px) scale(1.1);opacity:0}}
h1{font-family:"Playfair Display",Georgia,serif;font-style:italic;font-weight:600;font-size:40px;margin:14px 0 4px;background:linear-gradient(90deg,var(--pri),var(--o),var(--pri));background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 6s linear infinite}
@keyframes shine{to{background-position:200% center}}
.sub{font-size:15px;letter-spacing:.04em}
.beat{display:inline-block;animation:beat 1.6s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.25)}30%{transform:scale(1)}45%{transform:scale(1.18)}}
.card{background:var(--card);border:1px solid var(--line);border-radius:26px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 10px 40px -12px var(--glow);padding:20px}
input{border-radius:16px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
button{border-radius:999px;background:linear-gradient(135deg,var(--pri),#ff8fb8);box-shadow:0 6px 18px -6px var(--glow);transition:transform .15s}
button:active{transform:scale(.96)}
button.ghost{background:var(--pri2);color:var(--ink);box-shadow:none}
.g{border-radius:20px;background:var(--card);border:2px solid var(--line);color:var(--ink);box-shadow:none}
.g.sel{border-color:var(--pri);box-shadow:0 0 22px -4px var(--glow)}
.pill{background:var(--pri2);border-radius:999px}
.cell{border-radius:22px;background:var(--card);border:2px solid var(--line);box-shadow:none;color:var(--ink)}
.cell.X{color:var(--x);text-shadow:0 0 14px var(--glow);animation:pop .3s}
.cell.O{color:var(--o);text-shadow:0 0 14px var(--glow);animation:pop .3s}
.cell.W{box-shadow:0 0 24px var(--glow)}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
.status{font-family:"Playfair Display",Georgia,serif;font-style:italic;font-size:19px}
.burst{position:fixed;font-size:26px;pointer-events:none;z-index:5;animation:burst 1.6s ease-out forwards}
@keyframes burst{to{transform:translate(var(--dx),var(--dy)) rotate(var(--r));opacity:0}}
@media (prefers-reduced-motion:reduce){.fl,h1,.beat{animation:none}.fl{display:none}}
</style>
</head>
<body>
<div class="sky" id="sky"></div>
<main>
  <h1>Our Little Arcade</h1>
  <p class="sub"><span class="beat">💗</span> just the two of us <span class="beat">✨</span></p>

  <section id="lobby">
    <div class="card">
      <div id="v-home">
        <label for="name">Your name</label>
        <input id="name" maxlength="20" placeholder="e.g. Alex" autocomplete="off">
        <div style="display:flex;flex-direction:column;gap:10px;margin-top:18px">
          <button id="mk-open">✨ Create a room</button>
          <button class="ghost" id="jn-open">💌 Join a room</button>
        </div>
      </div>
      <div id="v-create" class="hide">
        <label>Choose a game</label>
        <div class="games" id="gamelist"></div>
        <div id="opts" class="hide">
          <div id="o-oc"><label>Rounds</label><div class="seg" id="seg-rounds"></div>
          <label>Letters</label><div class="seg" id="seg-lang"></div></div>
          <div id="o-wc"><label>Words in the chain</label><div class="seg" id="seg-words"></div></div>
        </div>
        <button id="mk" style="width:100%;margin-top:16px">Create room</button>
        <button class="ghost" data-back style="width:100%;margin-top:8px">← Back</button>
      </div>
      <div id="v-join" class="hide">
        <label for="code">Enter the room code</label>
        <input id="code" maxlength="12" autocapitalize="characters" autocomplete="off" placeholder="ABCDE" style="text-align:center;font-size:24px;letter-spacing:.2em;text-transform:uppercase">
        <button id="go" style="width:100%;margin-top:16px">Join room</button>
        <button class="ghost" data-back style="width:100%;margin-top:8px">← Back</button>
      </div>
      <p class="err" id="err"></p>
    </div>
  </section>

  <section id="room" class="hide">
    <div class="card">
      <div class="row"><span class="pill" id="rcode"></span><span id="gname"></span><button class="ghost" id="leave">Leave</button></div>
      <div class="invite"><div class="lbl">Room code</div><div class="bigcode" id="bigcode"></div></div>
      <div class="status" id="status"></div>
      <div id="stage"></div>
      <div class="row" style="margin-top:14px;justify-content:center;gap:10px">
        <button class="ghost" id="again">New round</button>
        <button class="ghost" id="copy">Copy invite link</button>
      </div>
    </div>
  </section>
</main>

<script>
/* ===== GAME REGISTRY — add new games here ===== */
const LINES=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
const OC={key:null,draft:{},written:false,timer:null};
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const CATS=[["boy","Boy","ولد"],["girl","Girl","بنت"],["plant","Plant","نبات"],["animal","Animal","حيوان"],["thing","Thing","جماد"],["country","Country","بلاد"]];
const norm=s=>(s||"").trim().toLowerCase().replace(/[\u064B-\u065F\u0670\u0640]/g,"").replace(/[أإآٱ]/g,"ا").replace(/ى/g,"ي").replace(/ة/g,"ه").replace(/\s+/g," ");
const stripAl=n=>n.startsWith("ال")&&n.length>2?n.slice(2):n;
const okLetter=(a,L)=>{const n=norm(a),l=norm(L);return !!n&&(n.startsWith(l)||stripAl(n).startsWith(l))};
function ocScore(a0,a1,L){return CATS.map(([k])=>{const x=(a0||{})[k]||"",y=(a1||{})[k]||"",v0=okLetter(x,L),v1=okLetter(y,L);let p0=0,p1=0;
  if(v0&&v1){const same=stripAl(norm(x))===stripAl(norm(y));p0=p1=same?5:10}else if(v0)p0=10;else if(v1)p1=10;
  return{k,x,y,v0,v1,p0,p1}})}
const GAMES={
  oc:{
    name:"Otobis Complete",emoji:"🚌",
    init(o){o=o||{};const rounds=o.rounds||3,lang=o.lang||"en";
      const pool=(lang==="ar"?"ابتجحخدرزسشصطعغفقكلمنهوي":"ABCDEFGHIJKLMNOPRSTW").split("");
      for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}
      return{opts:{rounds,lang},sid:Math.random().toString(36).slice(2,8),letters:pool.slice(0,rounds),round:0,phase:"play",by:null,scores:[0,0],win:null};
    },
    render(stage,s,ctx){
      clearInterval(OC.timer);
      const L=s.letters[s.round],key=s.sid+"_"+s.round,N=ctx.names;
      if(OC.key!==key){OC.key=key;OC.draft={};OC.written=false}
      const head='<div class="oc-top"><span class="pill">Round '+Math.min(s.round+1,s.opts.rounds)+'/'+s.opts.rounds+'</span><span class="pill">'+esc(N[0])+' '+s.scores[0]+' · '+esc(N[1])+' '+s.scores[1]+'</span></div>';
      if(s.phase==="done"){
        stage.dataset.k="";
        const w=s.win==="draw"?"It's a tie! 💞":esc(N[s.win])+" wins! 🏆";
        stage.innerHTML=head+'<div class="oc-letter" style="font-size:40px">'+w+'</div><div class="oc-scores"><div><b>'+esc(N[0])+'</b><br>'+s.scores[0]+'</div><div><b>'+esc(N[1])+'</b><br>'+s.scores[1]+'</div></div>';
        return;
      }
      if(s.phase==="play"){
        if(stage.dataset.k===key+"p")return;
        stage.dataset.k=key+"p";
        stage.innerHTML=head+'<div class="oc-letter">'+esc(L)+'</div>';
        const f=document.createElement("div");
        CATS.forEach(([k,en,ar])=>{
          const w=document.createElement("div");w.className="ocf";
          w.innerHTML='<span class="l"><span>'+en+'</span><span>'+ar+'</span></span>';
          const i=document.createElement("input");i.dir="auto";i.maxLength=30;i.autocomplete="off";i.placeholder=L+"…";i.value=OC.draft[k]||"";
          i.oninput=()=>{OC.draft[k]=i.value};w.appendChild(i);f.appendChild(w);
        });
        stage.appendChild(f);
        const er=document.createElement("p");er.className="err";stage.appendChild(er);
        const b=document.createElement("button");b.style.width="100%";b.textContent="🚌 Otobis Complete!";
        b.onclick=()=>{if(CATS.some(([k])=>!(OC.draft[k]||"").trim())){er.textContent="Fill all 6 sections first 💕";return}ctx.move({...s,phase:"scoring",by:ctx.myIdx})};
        stage.appendChild(b);return;
      }
      // scoring phase
      stage.dataset.k="";
      stage.innerHTML=head+'<p class="status">🚌 '+esc(N[s.by]||"Someone")+' called Otobis Complete!<br>Counting points…</p>';
      const mk=i=>ctx.db.doc("rooms/"+ctx.code+"/ans/"+s.sid+"_"+s.round+"_"+i);
      if(!OC.written){OC.written=true;mk(ctx.myIdx).set({a:{...OC.draft}}).catch(()=>{OC.written=false})}
      const results=(a0,a1)=>{
        const rows=ocScore(a0,a1,L),r0=rows.reduce((t,r)=>t+r.p0,0),r1=rows.reduce((t,r)=>t+r.p1,0);
        const cell=(v,x,p)=>'<td><span class="'+(x&&!v?"bad":"")+'">'+(x?esc(x):"—")+'</span> <span class="pts">+'+p+'</span></td>';
        stage.innerHTML=head+'<div class="oc-letter" style="font-size:48px">'+esc(L)+'</div><table class="oct"><tr><th></th><th>'+esc(N[0])+'</th><th>'+esc(N[1])+'</th></tr>'+
          rows.map((r,i)=>'<tr><td>'+CATS[i][1]+'</td>'+cell(r.v0,r.x,r.p0)+cell(r.v1,r.y,r.p1)+'</tr>').join("")+
          '<tr><td><b>Round</b></td><td class="pts">'+r0+'</td><td class="pts">'+r1+'</td></tr></table><p class="sub" style="font-size:12px;margin:8px 0 0">Same answer = 5 · different = 10 · only you = 10 · must start with the letter</p>';
        const last=s.round+1>=s.opts.rounds;
        const nb=document.createElement("button");nb.style.cssText="width:100%;margin-top:14px";nb.textContent=last?"See final result 🏆":"Next round →";
        nb.onclick=()=>{const t=[s.scores[0]+r0,s.scores[1]+r1];ctx.move(last?{...s,scores:t,phase:"done",win:t[0]===t[1]?"draw":t[0]>t[1]?0:1}:{...s,scores:t,round:s.round+1,phase:"play",by:null})};
        stage.appendChild(nb);
      };
      const poll=async()=>{try{const[x,y]=await Promise.all([mk(0).get(),mk(1).get()]);if(x.exists&&y.exists){clearInterval(OC.timer);results(x.data().a,y.data().a)}}catch(e){}};
      poll();OC.timer=setInterval(poll,900);
    },
    status(s,ctx){
      if(s.phase==="done")return s.win==="draw"?"It's a tie! 💞":s.win===ctx.myIdx?"You won! 🎉":ctx.names[s.win]+" won!";
      if(s.phase==="scoring")return "Otobis Complete! 🚌";
      return "Fill all 6 — go go go!";
    }
  },
  ul:{
    name:"Upper / Lower",emoji:"🔢",
    init(){return{sid:Math.random().toString(36).slice(2,8),phase:"pick",turn:1,hist:[],win:null}},
    render(stage,s,ctx){
      if(s.phase==="pick"&&stage.dataset.k===s.sid+"pick")return;
      clearInterval(UL.timer);
      const N=ctx.names,me=ctx.myIdx,other=1-me;
      const mkInput=()=>{const i=document.createElement("input");i.type="number";i.inputMode="numeric";i.min=1;i.max=99;i.placeholder="1–99";i.className="ulin";return i};
      const parse=i=>{const n=parseInt(i.value,10);return n>=1&&n<=99?n:null};
      if(s.phase==="pick"){
        stage.dataset.k=s.sid+"pick";
        stage.innerHTML='<p class="status">Pick your secret number (1–99) 🤫</p>';
        const box=document.createElement("div");stage.appendChild(box);
        const inp=mkInput(),err=document.createElement("p");err.className="err";
        const btn=document.createElement("button");btn.style.width="100%";btn.textContent="Lock it in 🔒";
        const locked=n=>{box.innerHTML='<div class="oc-letter">'+n+'</div><p class="sub">Locked in. Waiting for '+esc(N[other]||"your partner")+'…</p>'};
        btn.onclick=async()=>{const n=parse(inp);if(n===null){err.textContent="Pick a whole number from 1 to 99";return}
          btn.disabled=true;try{await ulDoc(ctx,s,me).set({n});locked(n)}catch(e){err.textContent="Couldn't save, try again";btn.disabled=false}};
        box.append(inp,err,btn);
        ulDoc(ctx,s,me).get().then(x=>{if(x.exists)locked(x.data().n)}).catch(()=>{});
        const poll=async()=>{try{const[a,b]=await Promise.all([ulDoc(ctx,s,0).get(),ulDoc(ctx,s,1).get()]);
          if(a.exists&&b.exists){clearInterval(UL.timer);if(me===0)ctx.move({...s,phase:"play"})}}catch(e){}};
        UL.timer=setInterval(poll,1000);
        return;
      }
      stage.dataset.k="";
      const hist=s.hist.slice().reverse().map(h=>'<div class="ulh"><b>'+esc(N[h.p])+'</b> guessed <b>'+h.g+'</b> → <span class="pts">'+(h.h==="Correct"?"🎯 Correct!":h.h==="Higher"?"⬆ Higher":"⬇ Lower")+'</span></div>').join("");
      if(s.phase==="done"){
        stage.innerHTML='<div class="oc-letter" style="font-size:36px">'+esc(N[s.win])+' guessed it! 🏆</div><p class="sub" id="ulrev"></p>'+hist;
        Promise.all([ulDoc(ctx,s,0).get(),ulDoc(ctx,s,1).get()]).then(([a,b])=>{$("ulrev").textContent=N[0]+"'s number: "+a.data().n+"  ·  "+N[1]+"'s number: "+b.data().n}).catch(()=>{});
        return;
      }
      stage.innerHTML='<p class="sub">Your secret number: <b id="ulmine" class="pts">…</b></p>';
      ulDoc(ctx,s,me).get().then(x=>{if(x.exists&&$("ulmine"))$("ulmine").textContent=x.data().n}).catch(()=>{});
      const act=document.createElement("div");stage.appendChild(act);
      if(s.turn===me){
        const inp=mkInput(),err=document.createElement("p");err.className="err";
        const btn=document.createElement("button");btn.style.width="100%";btn.textContent="Guess 🎯";
        btn.onclick=async()=>{const g=parse(inp);if(g===null){err.textContent="Guess a whole number from 1 to 99";return}
          btn.disabled=true;
          try{const x=await ulDoc(ctx,s,other).get();const sec=x.data().n;const win=g===sec;
            ctx.move({...s,hist:[...s.hist,{p:me,g,h:win?"Correct":g<sec?"Higher":"Lower"}],turn:win?me:other,win:win?me:null,phase:win?"done":"play"})}
          catch(e){err.textContent="Couldn't check that guess, try again";btn.disabled=false}};
        act.append(inp,err,btn);
      }else act.innerHTML='<p class="status">Waiting for '+esc(N[s.turn]||"your partner")+' to guess…</p>';
      const h=document.createElement("div");h.style.marginTop="12px";h.innerHTML=hist;stage.appendChild(h);
    },
    status(s,ctx){
      if(s.phase==="pick")return "Choose your secret number 🤫";
      if(s.phase==="done")return s.win===ctx.myIdx?"You guessed it! 🎉":ctx.names[s.win]+" guessed your number!";
      return s.turn===ctx.myIdx?"Your turn — guess their number":"Waiting for "+(ctx.names[s.turn]||"partner")+"…";
    }
  },
  wc:{
    name:"Word Chain",emoji:"🔗",
    init(o){return{opts:{words:Math.min(9,Math.max(5,(o&&o.words)||9))},sid:Math.random().toString(36).slice(2,8),phase:"pick",turn:1,prog:[{c:1,k:1},{c:1,k:1}],last:null,win:null}},
    render(stage,s,ctx){
      if(s.phase==="pick"&&stage.dataset.k===s.sid+"wpick")return;
      clearInterval(WC.timer);
      const N=ctx.names,me=ctx.myIdx,other=1-me,P=s.prog,c=P[me].c,k=P[me].k,WN=(s.opts&&s.opts.words)||9;
      const row=(w,i,cls)=>'<div class="wc '+cls+'"><span>'+(i+1)+'</span>'+esc(w)+'</div>';
      if(s.phase==="pick"){
        stage.dataset.k=s.sid+"wpick";
        stage.innerHTML='<p class="status">Write your '+WN+' secret words 🤫</p><p class="sub" style="font-size:13px;margin:0 0 8px">Each word should link to the next, like street → food → truck → stop. Your partner only sees word 1.</p>';
        const box=document.createElement("div");box.className="wpick";stage.appendChild(box);
        const ins=[];for(let i=0;i<WN;i++){const e=document.createElement("input");e.placeholder="Word "+(i+1);e.maxLength=20;e.autocomplete="off";e.dir="auto";ins.push(e);box.appendChild(e)}
        const err=document.createElement("p");err.className="err";
        const btn=document.createElement("button");btn.style.cssText="width:100%;margin-top:6px";btn.textContent="Lock it in 🔒";
        const locked=w=>{box.innerHTML='<p class="sub">Locked in 🔒 Waiting for '+esc(N[other]||"your partner")+'…</p>'+w.map((x,i)=>row(x,i,"on")).join("")};
        btn.onclick=async()=>{const ws=ins.map(i=>i.value.trim());
          if(ws.some(w=>!/^\S{2,20}$/.test(w))){err.textContent="Every word needs 2–20 letters, one word each, no spaces";return}
          btn.disabled=true;try{await chnDoc(ctx,s,me).set({w:ws});locked(ws)}catch(e){err.textContent="Couldn't save, try again";btn.disabled=false}};
        box.append(err,btn);
        chnDoc(ctx,s,me).get().then(x=>{if(x.exists)locked(x.data().w)}).catch(()=>{});
        const poll=async()=>{try{const[a,b]=await Promise.all([chnDoc(ctx,s,0).get(),chnDoc(ctx,s,1).get()]);
          if(a.exists&&b.exists){clearInterval(WC.timer);if(me===0)ctx.move({...s,phase:"play"})}}catch(e){}};
        WC.timer=setInterval(poll,1000);
        return;
      }
      stage.dataset.k="";
      if(s.phase==="done"){
        stage.innerHTML='<div class="oc-letter" style="font-size:34px">'+esc(N[s.win])+' finished the chain! 🏆</div><div id="wrev"></div>';
        Promise.all([chnDoc(ctx,s,0).get(),chnDoc(ctx,s,1).get()]).then(([a,b])=>{$("wrev").innerHTML=[a,b].map((x,i)=>'<p class="sub"><b>'+esc(N[i])+"'s chain:</b><br>"+x.data().w.map(esc).join(" → ")+'</p>').join("")}).catch(()=>{});
        return;
      }
      const getW=async()=>{if(WC.sid!==s.sid||!WC.w){const x=await chnDoc(ctx,s,other).get();WC.w=x.data().w;WC.sid=s.sid}return WC.w};
      stage.innerHTML='<div class="oc-top"><span class="pill">You: word '+(c+1)+'/'+WN+'</span><span class="pill">'+esc(N[other])+': word '+(P[other].c+1)+'/'+WN+'</span></div><div id="wcl" style="margin:10px 0"></div>';
      getW().then(W=>{$("wcl").innerHTML=W.map((w,i)=>i<c?row(w,i,"on"):i===c?row(w.slice(0,k)+"…",i,"cur"):row(w[0]+"…",i,"")).join("")}).catch(()=>{});
      if(s.last){const L=s.last,who=L.p===me?"You":esc(N[L.p]);
        const m=document.createElement("p");m.className="sub";m.innerHTML=L.t==="hint"?who+" asked for a letter 🔍":who+' guessed “'+esc(L.g)+'” '+(L.ok?"✅":"❌");stage.appendChild(m)}
      const act=document.createElement("div");stage.appendChild(act);
      if(s.turn!==me){act.innerHTML='<p class="status">Waiting for '+esc(N[s.turn]||"your partner")+'…</p>';return}
      const inp=document.createElement("input");inp.dir="auto";inp.autocomplete="off";inp.placeholder="Guess word "+(c+1)+" (starts with "+"…)";inp.className="ulin";inp.style.fontSize="20px";
      const err=document.createElement("p");err.className="err";
      const bg=document.createElement("button");bg.style.width="100%";bg.textContent="Guess 🎯";
      const bh=document.createElement("button");bh.className="ghost";bh.style.cssText="width:100%;margin-top:8px";bh.textContent="Reveal an extra letter 🔍";
      const go=async kind=>{
        const g=inp.value.trim();if(kind==="guess"&&!g){err.textContent="Type your guess first";return}
        bg.disabled=bh.disabled=true;
        try{const W=await getW();let np={c,k},last,win=null;
          if(kind==="guess"){const ok=norm(g)===norm(W[c]);last={p:me,t:"guess",g,ok};if(ok)np={c:c+1,k:1}}
          else{last={p:me,t:"hint"};np=k+1>=W[c].length?{c:c+1,k:1}:{c,k:k+1}}
          if(np.c>=W.length)win=me;
          const prog=P.slice();prog[me]=np;
          ctx.move({...s,prog,last,turn:other,win,phase:win===null?"play":"done"});
        }catch(e){err.textContent="Something went wrong, try again";bg.disabled=bh.disabled=false}
      };
      bg.onclick=()=>go("guess");bh.onclick=()=>go("hint");
      act.append(inp,err,bg,bh);
    },
    status(s,ctx){
      if(s.phase==="pick")return "Write your secret chain 🤫";
      if(s.phase==="done")return s.win===ctx.myIdx?"You cracked the chain! 🎉":ctx.names[s.win]+" cracked your chain!";
      return s.turn===ctx.myIdx?"Your turn — guess or ask for a letter":"Waiting for "+(ctx.names[s.turn]||"partner")+"…";
    }
  },
  ttt:{
    name:"Tic-Tac-Toe",emoji:"❌⭕",
    init:()=>({b:Array(9).fill(""),turn:0,win:null,line:null}),
    // render(stage, state, ctx) ; ctx={myIdx, names, move(newState)}
    render(stage,s,ctx){
      stage.innerHTML="";
      const board=document.createElement("div");board.className="board";
      s.b.forEach((v,i)=>{
        const c=document.createElement("button");c.className="cell "+v+(s.line&&s.line.includes(i)?" W":"");c.textContent=v==="X"?"♥":v==="O"?"✦":"";
        c.onclick=()=>{
          if(s.win||v||s.turn!==ctx.myIdx)return;
          const b=s.b.slice();b[i]=ctx.myIdx===0?"X":"O";
          let win=null,line=null;
          for(const L of LINES){if(b[L[0]]&&b[L[0]]===b[L[1]]&&b[L[0]]===b[L[2]]){win=ctx.myIdx;line=L;}}
          if(!win&&win!==0&&b.every(x=>x))win="draw";
          ctx.move({b,turn:1-s.turn,win,line});
        };
        board.appendChild(c);
      });
      stage.appendChild(board);
    },
    status(s,ctx){
      if(s.win==="draw")return "It's a draw 🤝";
      if(s.win!==null)return s.win===ctx.myIdx?"You won! 🎉":ctx.names[s.win]+" won!";
      return s.turn===ctx.myIdx?"Your turn ("+(ctx.myIdx===0?"♥":"✦")+")":"Waiting for "+(ctx.names[s.turn]||"partner")+"…";
    }
  }
};

/* ===== App ===== */

const $=id=>document.getElementById(id);
let db=null,uid=null,unsub=null,cur=null,selGame="oc";
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};

$("name").value=store.get("arcade-name")||"";
const hashCode=(location.hash||"").slice(1).toUpperCase();
$("code").value=hashCode;

const list=$("gamelist");
Object.entries(GAMES).forEach(([id,g])=>{
  const b=document.createElement("button");b.className="g"+(id===selGame?" sel":"");
  b.innerHTML="<span>"+g.emoji+"</span>"+g.name;
  b.onclick=()=>{selGame=id;[...list.children].forEach(x=>x.classList.remove("sel"));b.classList.add("sel");updOpts()};
  list.appendChild(b);
});

/* ===== PASTE YOUR FIREBASE CONFIG HERE (see README.md) ===== */
const FIREBASE_CONFIG={
  apiKey:"PASTE_API_KEY",
  authDomain:"PASTE_PROJECT_ID.firebaseapp.com",
  projectId:"PASTE_PROJECT_ID",
  appId:"PASTE_APP_ID"
};
(function(){
  try{
    if(!window.firebase){$("err").textContent="Couldn't load the game server. Check your internet connection and refresh.";return}
    if(FIREBASE_CONFIG.apiKey.indexOf("PASTE")===0){$("err").textContent="Setup needed: add your Firebase config (see README.md).";return}
    firebase.initializeApp(FIREBASE_CONFIG);
    db=firebase.firestore();
    try{db.settings({experimentalAutoDetectLongPolling:true,merge:true})}catch(e){}
    let id=store.get("arcade-uid");
    if(!id){id="u"+Math.random().toString(36).slice(2)+Date.now().toString(36);store.set("arcade-uid",id)}
    uid=id;
  }catch(e){$("err").textContent="Couldn't connect to the game server."}
})();

function show(inRoom){$("lobby").classList.toggle("hide",inRoom);$("room").classList.toggle("hide",!inRoom);if(!inRoom)view("v-home")}

let mode="join";
$("go").onclick=async()=>{
  const name=$("name").value.trim()||"Player",code=mode==="create"?Math.random().toString(36).slice(2,7).toUpperCase().replace(/[^A-Z0-9]/g,"X"):$("code").value.trim().toUpperCase().replace(/[^A-Z0-9]/g,"");
  if(!code){$("err").textContent="Enter a room code.";return}
  if(!db||!uid){$("err").textContent="Can't connect to the game server. Refresh and try again.";return}
  store.set("arcade-name",name);$("go").disabled=true;$("err").textContent="";
  try{
    const ref=db.doc("rooms/"+code);const snap=await ref.get();
    if(!snap.exists){
      if(mode==="join"){$("err").textContent="Room not found. Check the code and try again.";$("go").disabled=false;return}
      await ref.set({game:selGame,players:[{id:uid,name}],state:GAMES[selGame].init(opts)});
    }else{
      const d=snap.data();
      const i=d.players.findIndex(p=>p.id===uid);
      if(i<0){
        if(d.players.length>=2){$("err").textContent="That room is full.";$("go").disabled=false;return}
        await ref.update({players:[...d.players,{id:uid,name}]});
      }
    }
    enter(code,ref);
  }catch(e){$("err").textContent="Couldn't join: "+(e.message||e.code||"error")}
  $("go").disabled=false;
};

function enter(code,ref){
  cur={code,ref};show(true);$("rcode").textContent="Room "+code;$("bigcode").textContent=code;
  history.replaceState(null,"","#"+code);
  unsub=ref.onSnapshot(snap=>{
    if(!snap.exists)return;const d=snap.data(),g=GAMES[d.game];if(!g)return;
    $("gname").textContent=g.emoji+" "+g.name;
    const myIdx=d.players.findIndex(p=>p.id===uid);
    const names=d.players.map(p=>p.name);
    const ctx={myIdx,names,db,code,move:st=>ref.update({state:st}).catch(()=>{})};
    $("status").textContent=d.players.length<2?"Waiting for your partner to join… share the code "+code:g.status(d.state,ctx);
    if(d.players.length<2){$("stage").innerHTML="";return}
    g.render($("stage"),d.state,ctx);
    if(d.state.win!==null&&d.state.win!=="draw"&&d.state.win===myIdx){if(!celebrated){celebrated=true;burst()}}else if(d.state.win===null)celebrated=false;
    $("again").onclick=()=>ref.update({state:g.init(d.state.opts)});
  },e=>{$("status").textContent="Connection problem: "+(e.message||e.code)});
}

$("leave").onclick=()=>{if(unsub)unsub();unsub=null;cur=null;history.replaceState(null,"","#");show(false)};
$("copy").onclick=async()=>{
  const url=location.href.split("#")[0]+"#"+(cur?cur.code:"");
  const done=t=>{$("copy").textContent=t;setTimeout(()=>$("copy").textContent="Copy invite link",1800)};
  if(navigator.share){try{await navigator.share({title:"Our Arcade",text:"Join my game room "+(cur?cur.code:""),url});return}catch(e){if(e&&e.name==="AbortError")return}}
  try{await navigator.clipboard.writeText(url);done("Copied ✓")}catch(e){window.prompt("Copy this invite link:",url)}
};
let celebrated=false;
function burst(){
  const em=["💖","✨","💕","🌸","⭐"];
  for(let i=0;i<26;i++){
    const s=document.createElement("span");s.className="burst";s.textContent=em[i%em.length];
    s.style.left="50%";s.style.top="45%";
    const a=Math.random()*6.28,r=120+Math.random()*180;
    s.style.setProperty("--dx",Math.cos(a)*r+"px");s.style.setProperty("--dy",Math.sin(a)*r+"px");s.style.setProperty("--r",(Math.random()*360-180)+"deg");
    document.body.appendChild(s);setTimeout(()=>s.remove(),1700);
  }
}
(function(){
  const sky=$("sky"),em=["💗","✨","🌸","💕","⭐","🤍"];
  for(let i=0;i<14;i++){
    const s=document.createElement("span");s.className="fl";s.textContent=em[i%em.length];
    s.style.left=Math.random()*100+"%";s.style.fontSize=(12+Math.random()*16)+"px";
    s.style.animationDuration=(12+Math.random()*14)+"s";s.style.animationDelay=(-Math.random()*20)+"s";
    sky.appendChild(s);
  }
})();
function view(id){["v-home","v-create","v-join"].forEach(v=>$(v).classList.toggle("hide",v!==id));$("err").textContent=""}
function needName(){if(!$("name").value.trim()){$("err").textContent="Tell me your name first 💕";$("name").focus();return false}return true}
$("mk-open").onclick=()=>{if(needName())view("v-create")};
$("jn-open").onclick=()=>{if(needName())view("v-join")};
document.querySelectorAll("[data-back]").forEach(b=>b.onclick=()=>view("v-home"));
$("mk").onclick=()=>{mode="create";$("go").onclick()};
$("code").addEventListener("input",()=>{mode="join"});
$("jn-open").addEventListener("click",()=>{mode="join"});
if(hashCode&&$("name").value.trim())view("v-join");
const UL={timer:null};
const WN=9,WC={timer:null,sid:null,w:null};
const chnDoc=(ctx,s,i)=>ctx.db.doc("rooms/"+ctx.code+"/chn/"+s.sid+"_"+i);
const ulDoc=(ctx,s,i)=>ctx.db.doc("rooms/"+ctx.code+"/sec/"+s.sid+"_"+i);
let opts={rounds:3,lang:"en",words:9};
function seg(id,items,key){const c=$(id);c.innerHTML="";items.forEach(([v,t])=>{const b=document.createElement("button");b.className="g"+(opts[key]===v?" sel":"");b.textContent=t;b.onclick=()=>{opts[key]=v;[...c.children].forEach(x=>x.classList.remove("sel"));b.classList.add("sel")};c.appendChild(b)})}
seg("seg-rounds",[[1,"1 round"],[3,"3 rounds"],[5,"5 rounds"]],"rounds");
seg("seg-lang",[["en","English A–Z"],["ar","العربية أ–ي"]],"lang");
seg("seg-words",[[5,"5"],[6,"6"],[7,"7"],[8,"8"],[9,"9"]],"words");
function updOpts(){$("opts").classList.toggle("hide",selGame!=="oc"&&selGame!=="wc");$("o-oc").classList.toggle("hide",selGame!=="oc");$("o-wc").classList.toggle("hide",selGame!=="wc")}
updOpts();
</script>
