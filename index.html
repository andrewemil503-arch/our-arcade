<style>
:root{--bg:#fff7f9;--card:#fff;--ink:#3a2a31;--mute:#8d7480;--pri:#d9507f;--line:#f0dbe3;--cell:#fdf0f4;--x:#d9507f;--o:#5a7be0;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1418;--card:#281c22;--ink:#f6e9ee;--mute:#b79aa7;--pri:#ee6c98;--line:#3d2b34;--cell:#33232b;--x:#ee6c98;--o:#8fb0ff;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1c1418;--card:#281c22;--ink:#f6e9ee;--mute:#b79aa7;--pri:#ee6c98;--line:#3d2b34;--cell:#33232b;--x:#ee6c98;--o:#8fb0ff;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}
main{max-width:460px;margin:0 auto;padding:24px 16px 40px}
h1{font-size:26px;margin:8px 0 2px;text-align:center}
.sub{text-align:center;color:var(--mute);margin:0 0 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;margin-bottom:14px}
label{display:block;font-size:13px;color:var(--mute);margin:12px 0 5px}
input{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;outline:none}
input:focus{border-color:var(--pri)}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:12px 16px;background:var(--pri);color:#fff;font-weight:600}
button.ghost{background:var(--cell);color:var(--ink)}
button:disabled{opacity:.5}
#go{margin-top:8px}
.games{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g{background:var(--cell);border:2px solid transparent;color:var(--ink);text-align:center;padding:14px 8px}
.g.sel{border-color:var(--pri)}
.g span{display:block;font-size:28px;margin-bottom:2px}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between}
.pill{background:var(--cell);padding:5px 12px;border-radius:99px;font-size:13px}
#gname{font-weight:600}
.status{text-align:center;font-weight:600;margin:14px 0;min-height:24px}
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:320px;margin:0 auto}
.cell{aspect-ratio:1;font-size:40px;font-weight:700;background:var(--cell);border:2px solid transparent;color:var(--ink);padding:0;border-radius:16px;line-height:1}
.cell.X{color:var(--x)}.cell.O{color:var(--o)}
.cell.W{border-color:var(--pri)}
.err{color:var(--pri);text-align:center;font-size:14px;min-height:20px;margin:8px 0 0}
.hide{display:none}
.seg{display:flex;gap:8px}.seg button{flex:1;padding:10px 4px;font-size:14px}
.oc-top{display:flex;justify-content:space-between;gap:6px;flex-wrap:wrap}
.oc-letter{font-family:"Playfair Display",Georgia,serif;font-size:84px;text-align:center;color:var(--pri);text-shadow:0 0 22px var(--glow);line-height:1.1;margin:6px 0}
.ocf{margin:8px 0}.ocf .l{display:flex;justify-content:space-between;font-size:13px;color:var(--mute);margin:0 4px 3px}
.oct{width:100%;border-collapse:collapse;font-size:14px}.oct td,.oct th{padding:7px 4px;border-bottom:1px solid var(--line);text-align:center}.oct td:first-child{text-align:left;color:var(--mute)}
.pts{color:var(--pri);font-weight:700}.bad{text-decoration:line-through;opacity:.6}

:root{--bg1:#ffe4ee;--bg2:#e8d9ff;--bg3:#ffd9c9;--card:rgba(255,255,255,.62);--ink:#4a2340;--mute:#8d6a86;--pri:#e8457f;--pri2:rgba(232,69,127,.14);--line:rgba(255,255,255,.9);--cell:rgba(255,255,255,.55);--x:#e8457f;--o:#8a5cf0;--glow:rgba(232,69,127,.35)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#1b1033;--bg2:#3a1745;--bg3:#12123a;--card:rgba(255,255,255,.08);--ink:#fff0f6;--mute:#d3a9c8;--pri:#ff6fa5;--pri2:rgba(255,111,165,.18);--line:rgba(255,255,255,.18);--cell:rgba(255,255,255,.08);--x:#ff7fb0;--o:#b79bff;--glow:rgba(255,111,165,.45)}}
:root[data-theme="dark"]{--bg1:#1b1033;--bg2:#3a1745;--bg3:#12123a;--card:rgba(255,255,255,.08);--ink:#fff0f6;--mute:#d3a9c8;--pri:#ff6fa5;--pri2:rgba(255,111,165,.18);--line:rgba(255,255,255,.18);--cell:rgba(255,255,255,.08);--x:#ff7fb0;--o:#b79bff;--glow:rgba(255,111,165,.45)}
body{font-family:Nunito,system-ui,-apple-system,sans-serif;background:linear-gradient(160deg,var(--bg1),var(--bg2) 55%,var(--bg3));background-attachment:fixed;position:relative;overflow-x:hidden}
.sky{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}

.fl{position:absolute;bottom:-40px;opacity:0;animation:rise linear infinite;filter:drop-shadow(0 0 6px var(--glow))}
@keyframes rise{0%{transform:translateY(0) translateX(0) scale(.7);opacity:0}15%{opacity:.7}80%{opacity:.5}100%{transform:translateY(-110vh) translateX(30px) scale(1.1);opacity:0}}
h1{font-family:"Playfair Display",Georgia,serif;font-style:italic;font-weight:600;font-size:40px;margin:14px 0 4px;background:linear-gradient(90deg,var(--pri),var(--o),var(--pri));background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 6s linear infinite}
@keyframes shine{to{background-position:200% center}}

@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.25)}30%{transform:scale(1)}45%{transform:scale(1.18)}}
.card{background:var(--card);border:1px solid var(--line);border-radius:26px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 10px 40px -12px var(--glow);padding:20px}

@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}

<style>
@keyframes float{50%{transform:translateY(-4px) rotate(-4deg)}}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes letter{0%{transform:scale(.2) rotate(-25deg);opacity:0}100%{transform:none;opacity:1}}
@keyframes flip{0%{transform:rotateX(90deg);opacity:0}100%{transform:none;opacity:1}}
@keyframes ring{0%{box-shadow:0 0 0 0 var(--glow)}100%{box-shadow:0 0 0 12px transparent}}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.brand{display:flex;align-items:center;justify-content:center;gap:12px;margin:10px 0 4px}

.card{animation:up .5s both}.card>div:not(.hide){animation:up .35s both}
#stage>*:not(.board){animation:fade .3s both}
button{min-height:48px;letter-spacing:.01em}button:hover{filter:brightness(1.06)}
.cell{min-height:0}.cell.X,.cell.O{animation:none}
.games{grid-template-columns:1fr}

.games .g:nth-child(2){animation-delay:.07s}.games .g:nth-child(3){animation-delay:.14s}.games .g:nth-child(4){animation-delay:.21s}
.g:hover{transform:translateY(-2px)}
.g>span{font-size:28px;margin:0;width:46px;height:46px;display:grid;place-items:center;border-radius:14px;background:var(--pri2);flex:none}

.pl b{font-size:14px;max-width:96px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl.turn{background:var(--card);box-shadow:0 0 0 2px var(--pri),0 6px 18px -6px var(--glow)}.pl.turn i{animation:ring 1.4s infinite}
.pl.wait{opacity:.6}.vs{font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.1em}
.bigcode{font-size:38px}
main{position:relative;padding-top:64px}.mute{position:absolute;top:10px;right:16px;z-index:6;width:44px;min-height:44px;height:44px;padding:0;border-radius:50%;font-size:18px;background:var(--card);color:var(--ink);box-shadow:0 4px 14px -6px var(--glow);border:1px solid var(--line)}
.oc-letter{animation:letter .7s cubic-bezier(.2,1.6,.4,1) both}
.oct tr{animation:up .4s both}.oct tr:nth-child(n+2){animation-delay:.12s}.oct tr:nth-child(n+4){animation-delay:.24s}.oct tr:nth-child(n+6){animation-delay:.36s}
.ulh:first-child{animation:up .4s both}
.wc.on:has(+ .wc.cur){animation:flip .5s both}
.shake{animation:shake .4s}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<style>
html{overflow-x:hidden;width:100%}body{overflow-x:clip;width:100%;margin:0}
main{width:100%;max-width:480px;margin:0 auto;padding-left:16px;padding-right:16px}
.mute{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);right:calc(env(safe-area-inset-right,0px) + 14px);left:auto;width:40px;height:40px;min-height:40px;padding:0;display:grid;place-items:center;border-radius:50%;background:var(--card);color:var(--ink);border:1px solid var(--line);box-shadow:0 4px 14px -6px var(--glow);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.brand svg{animation:pulse 4s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.07)}}
@keyframes drift{from{transform:translate(-6%,-5%) scale(1)}to{transform:translate(8%,7%) scale(1.15)}}
@keyframes tw{0%,100%{opacity:.08}50%{opacity:.7}}
.blob{position:absolute;border-radius:50%;filter:blur(60px);will-change:transform;animation:drift 26s ease-in-out infinite alternate}
.b1{width:70vmax;height:70vmax;left:-28vmax;top:-24vmax;background:var(--pri);opacity:.25}
.b2{width:60vmax;height:60vmax;right:-24vmax;top:28vh;background:var(--o);opacity:.22;animation-duration:32s}
.b3{width:55vmax;height:55vmax;left:2vw;bottom:-28vmax;background:#ffb199;opacity:.2;animation-duration:29s}
.dot{position:absolute;bottom:-40px;border-radius:50%;opacity:0;animation:rise linear infinite;background:radial-gradient(circle at 35% 35%,rgba(255,255,255,.9),rgba(255,182,212,.35) 45%,rgba(255,182,212,0) 70%)}
.st{position:absolute;width:2px;height:2px;border-radius:50%;background:var(--pri);animation:tw 4s ease-in-out infinite}
.cf{position:fixed;top:-16px;z-index:7;pointer-events:none;animation:fall var(--d) ease-in forwards}
@keyframes fall{to{transform:translate3d(var(--x),108vh,0) rotate(var(--r));opacity:.85}}
.g>span{font-family:"Playfair Display",Georgia,serif;font-style:italic;font-weight:600;font-size:18px;color:var(--pri);letter-spacing:-.02em}
.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-4px)}40%,80%{transform:translateX(4px)}}
.pill{font-weight:700}
</style>

<body>
<div class="sky" id="sky"></div>
<main>
  <button class="mute" id="mute" aria-label="Sound on/off"></button>
  <div class="brand"><svg viewBox="0 0 24 24" width="42" height="42"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff6fa5"/><stop offset="1" stop-color="#8a5cf0"/></linearGradient></defs><path fill="url(#lg)" d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 5 6.3 5c2 0 3.6 1.1 4.4 2.6h.6C12.1 6.1 13.7 5 15.7 5 19 5 21.1 8.4 19.6 11.8 17.5 16.4 12 21 12 21z"/></svg><h1>Our Little Arcade</h1></div>
  <p class="sub">Games for two, just us </p>

  <section id="lobby">
    <div class="card">
      <div id="v-home">
        <label for="name">Your name</label>
        <input id="name" maxlength="20" placeholder="e.g. Alex" autocomplete="off">
        <div style="display:flex;flex-direction:column;gap:10px;margin-top:18px">
          <button id="mk-open"> Create a room</button>
          <button class="ghost" id="jn-open"> Join a room</button>
        </div>
      </div>
      <div id="v-create" class="hide">
        <label>Choose a game</label>
        <div class="games" id="gamelist"></div>
        <div id="opts" class="hide">
          <div id="o-oc"><label>Rounds</label><div class="seg" id="seg-rounds"></div>
          <label>Letters</label><div class="seg" id="seg-lang"></div></div>
          <div id="o-wc"><label>Words in the chain</label><div class="seg" id="seg-words"></div></div>
        </div>
        <button id="mk" style="width:100%;margin-top:16px">Create room</button>
        <button class="ghost" data-back style="width:100%;margin-top:8px">← Back</button>
      </div>
      <div id="v-join" class="hide">
        <label for="code">Enter the room code</label>
        <input id="code" maxlength="12" autocapitalize="characters" autocomplete="off" placeholder="ABCDE" style="text-align:center;font-size:24px;letter-spacing:.2em;text-transform:uppercase">
        <button id="go" style="width:100%;margin-top:16px">Join room</button>
        <button class="ghost" data-back style="width:100%;margin-top:8px">← Back</button>
      </div>
      <p class="err" id="err"></p>
    </div>
  </section>

  <section id="room" class="hide">
    <div class="card">
      <div class="row"><span class="pill" id="rcode"></span><span id="gname"></span><button class="ghost" id="leave">Leave</button></div>
      <div class="players" id="players"></div>
      <div class="invite"><div class="lbl">Room code</div><div class="bigcode" id="bigcode"></div></div>
      <div class="status" id="status"></div>
      <div id="stage"></div>
      <div class="row" style="margin-top:14px;justify-content:center;gap:10px">
        <button class="ghost" id="again">New round</button>
        <button class="ghost" id="copy">Copy invite link</button>
      </div>
    </div>
  </section>
</main>

<script>
/* ===== GAME REGISTRY — add new games here ===== */
const LINES=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
const OC={key:null,draft:{},written:false,timer:null};
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const CATS=[["boy","Boy","ولد"],["girl","Girl","بنت"],["plant","Plant","نبات"],["animal","Animal","حيوان"],["thing","Thing","جماد"],["country","Country","بلاد"]];
const norm=s=>(s||"").trim().toLowerCase().replace(/[\u064B-\u065F\u0670\u0640]/g,"").replace(/[أإآٱ]/g,"ا").replace(/ى/g,"ي").replace(/ة/g,"ه").replace(/\s+/g," ");
const stripAl=n=>n.startsWith("ال")&&n.length>2?n.slice(2):n;
const okLetter=(a,L)=>{const n=norm(a),l=norm(L);return !!n&&(n.startsWith(l)||stripAl(n).startsWith(l))};
function ocScore(a0,a1,L){return CATS.map(([k])=>{const x=(a0||{})[k]||"",y=(a1||{})[k]||"",v0=okLetter(x,L),v1=okLetter(y,L);let p0=0,p1=0;
  if(v0&&v1){const same=stripAl(norm(x))===stripAl(norm(y));p0=p1=same?5:10}else if(v0)p0=10;else if(v1)p1=10;
  return{k,x,y,v0,v1,p0,p1}})}
const GAMES={
  oc:{
    name:"Otobis Complete",emoji:"Aa",desc:"Race to fill 6 words that start with the same letter",
    init(o){o=o||{};const rounds=o.rounds||3,lang=o.lang||"en";
      const pool=(lang==="ar"?"ابتجحخدرزسشصطعغفقكلمنهوي":"ABCDEFGHIJKLMNOPRSTW").split("");
      for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}
      return{opts:{rounds,lang},sid:Math.random().toString(36).slice(2,8),letters:pool.slice(0,rounds),round:0,phase:"play",by:null,scores:[0,0],win:null};
    },
    render(stage,s,ctx){
      clearInterval(OC.timer);
      const L=s.letters[s.round],key=s.sid+"_"+s.round,N=ctx.names;
      if(OC.key!==key){OC.key=key;OC.draft={};OC.written=false}
      const head='<div class="oc-top"><span class="pill">Round '+Math.min(s.round+1,s.opts.rounds)+'/'+s.opts.rounds+'</span><span class="pill">'+esc(N[0])+' '+s.scores[0]+' · '+esc(N[1])+' '+s.scores[1]+'</span></div>';
      if(s.phase==="done"){
        stage.dataset.k="";
        const w=s.win==="draw"?"It's a tie! ":esc(N[s.win])+" wins! ";
        stage.innerHTML=head+'<div class="oc-letter" style="font-size:40px">'+w+'</div><div class="oc-scores"><div><b>'+esc(N[0])+'</b><br>'+s.scores[0]+'</div><div><b>'+esc(N[1])+'</b><br>'+s.scores[1]+'</div></div>';
        return;
      }
      if(s.phase==="play"){
        if(stage.dataset.k===key+"p")return;
        stage.dataset.k=key+"p";
        stage.innerHTML=head+'<div class="oc-letter">'+esc(L)+'</div>';
        const f=document.createElement("div");
        CATS.forEach(([k,en,ar])=>{
          const w=document.createElement("div");w.className="ocf";
          w.innerHTML='<span class="l"><span>'+en+'</span><span>'+ar+'</span></span>';
          const i=document.createElement("input");i.dir="auto";i.maxLength=30;i.autocomplete="off";i.placeholder=L+"…";i.value=OC.draft[k]||"";
          i.oninput=()=>{OC.draft[k]=i.value};w.appendChild(i);f.appendChild(w);
        });
        stage.appendChild(f);
        const er=document.createElement("p");er.className="err";stage.appendChild(er);
        const b=document.createElement("button");b.style.width="100%";b.textContent=" Otobis Complete!";
        b.onclick=()=>{if(CATS.some(([k])=>!(OC.draft[k]||"").trim())){er.textContent="Fill all 6 sections first ";return}ctx.move({...s,phase:"scoring",by:ctx.myIdx})};
        stage.appendChild(b);return;
      }
      // scoring phase
      stage.dataset.k="";
      stage.innerHTML=head+'<p class="status"> '+esc(N[s.by]||"Someone")+' called Otobis Complete!<br>Counting points…</p>';
      const mk=i=>ctx.db.doc("rooms/"+ctx.code+"/ans/"+s.sid+"_"+s.round+"_"+i);
      if(!OC.written){OC.written=true;mk(ctx.myIdx).set({a:{...OC.draft}}).catch(()=>{OC.written=false})}
      const results=(a0,a1)=>{SFX.play("reveal");
        const rows=ocScore(a0,a1,L),r0=rows.reduce((t,r)=>t+r.p0,0),r1=rows.reduce((t,r)=>t+r.p1,0);
        const cell=(v,x,p)=>'<td><span class="'+(x&&!v?"bad":"")+'">'+(x?esc(x):"—")+'</span> <span class="pts">+'+p+'</span></td>';
        stage.innerHTML=head+'<div class="oc-letter" style="font-size:48px">'+esc(L)+'</div><table class="oct"><tr><th></th><th>'+esc(N[0])+'</th><th>'+esc(N[1])+'</th></tr>'+
          rows.map((r,i)=>'<tr><td>'+CATS[i][1]+'</td>'+cell(r.v0,r.x,r.p0)+cell(r.v1,r.y,r.p1)+'</tr>').join("")+
          '<tr><td><b>Round</b></td><td class="pts">'+r0+'</td><td class="pts">'+r1+'</td></tr></table><p class="sub" style="font-size:12px;margin:8px 0 0">Same answer = 5 · different = 10 · only you = 10 · must start with the letter</p>';
        const last=s.round+1>=s.opts.rounds;
        const nb=document.createElement("button");nb.style.cssText="width:100%;margin-top:14px";nb.textContent=last?"See final result ":"Next round →";
        nb.onclick=()=>{const t=[s.scores[0]+r0,s.scores[1]+r1];ctx.move(last?{...s,scores:t,phase:"done",win:t[0]===t[1]?"draw":t[0]>t[1]?0:1}:{...s,scores:t,round:s.round+1,phase:"play",by:null})};
        stage.appendChild(nb);
      };
      const poll=async()=>{try{const[x,y]=await Promise.all([mk(0).get(),mk(1).get()]);if(x.exists&&y.exists){clearInterval(OC.timer);results(x.data().a,y.data().a)}}catch(e){}};
      poll();OC.timer=setInterval(poll,900);
    },
    status(s,ctx){
      if(s.phase==="done")return s.win==="draw"?"It's a tie! ":s.win===ctx.myIdx?"You won! ":ctx.names[s.win]+" won!";
      if(s.phase==="scoring")return "Otobis Complete! ";
      return "Fill all 6 — go go go!";
    }
  },
  ul:{
    name:"Upper / Lower",emoji:"1↕9",desc:"Guess each other's secret number (1–99)",
    init(){return{sid:Math.random().toString(36).slice(2,8),phase:"pick",turn:1,hist:[],win:null}},
    render(stage,s,ctx){
      if(s.phase==="pick"&&stage.dataset.k===s.sid+"pick")return;
      clearInterval(UL.timer);
      const N=ctx.names,me=ctx.myIdx,other=1-me;
      const mkInput=()=>{const i=document.createElement("input");i.type="number";i.inputMode="numeric";i.min=1;i.max=99;i.placeholder="1–99";i.className="ulin";return i};
      const parse=i=>{const n=parseInt(i.value,10);return n>=1&&n<=99?n:null};
      if(s.phase==="pick"){
        stage.dataset.k=s.sid+"pick";
        stage.innerHTML='<p class="status">Pick your secret number (1–99) </p>';
        const box=document.createElement("div");stage.appendChild(box);
        const inp=mkInput(),err=document.createElement("p");err.className="err";
        const btn=document.createElement("button");btn.style.width="100%";btn.textContent="Lock it in ";
        const locked=n=>{box.innerHTML='<div class="oc-letter">'+n+'</div><p class="sub">Locked in. Waiting for '+esc(N[other]||"your partner")+'…</p>'};
        btn.onclick=async()=>{const n=parse(inp);if(n===null){err.textContent="Pick a whole number from 1 to 99";return}
          btn.disabled=true;try{await ulDoc(ctx,s,me).set({n});locked(n)}catch(e){err.textContent="Couldn't save, try again";btn.disabled=false}};

  wc:{

        const poll=async()=>{try{const[a,b]=await Promise.all([chnDoc(ctx,s,0).get(),chnDoc(ctx,s,1).get()]);

      return s.turn===ctx.myIdx?"Your turn ("+(ctx.myIdx===0?"♥":"✦")+")":"Waiting for "+(ctx.names[s.turn]||"partner")+"…";
    }
  }
};

$("go").onclick=async()=>{
  const name=$("name").value.trim()||"Player",code=mode==="create"?Math.random().toString(36).slice(2,7).toUpperCase().replace(/[^A-Z0-9]/g,"X"):$("code").value.trim().toUpperCase().replace(/[^A-Z0-9]/g,"");
  if(!code){$("err").textContent="Enter a room code.";return}
  if(!db||!uid){$("err").textContent="Can't connect to the game server. Refresh and try again.";return}
  store.set("arcade-name",name);$("go").disabled=true;$("err").textContent="";
  try{
    const ref=db.doc("rooms/"+code);const snap=await ref.get();
    if(!snap.exists){
      if(mode==="join"){$("err").textContent="Room not found. Check the code and try again.";$("go").disabled=false;return}
      await ref.set({game:selGame,players:[{id:uid,name}],state:GAMES[selGame].init(opts)});
    }else{
      const d=snap.data();
      const i=d.players.findIndex(p=>p.id===uid);
      if(i<0){
        if(d.players.length>=2){$("err").textContent="That room is full.";$("go").disabled=false;return}

function enter(code,ref){
  cur={code,ref};prevD=null;show(true);$("rcode").textContent="Room "+code;$("bigcode").textContent=code;
  history.replaceState(null,"","#"+code);
  unsub=ref.onSnapshot(snap=>{
    if(!snap.exists)return;const d=snap.data(),g=GAMES[d.game];if(!g)return;
    $("gname").textContent=g.name;
    const myIdx=d.players.findIndex(p=>p.id===uid);
    const names=d.players.map(p=>p.name);
    const ctx={myIdx,names,db,code,move:st=>ref.update({state:st}).catch(()=>{})};
    const live=d.state.turn!==undefined&&d.state.phase!=="pick"&&d.state.phase!=="done"&&d.state.win==null;
    $("players").innerHTML=d.players.map((p,i)=>'<div class="pl'+(live&&d.state.turn===i?" turn":"")+'"><i style="--h:'+(i?250:340)+'">'+esc((p.name||"?")[0].toUpperCase())+'</i><b>'+esc(p.name)+(i===myIdx?" (you)":"")+'</b></div>').join('<span class="vs">vs</span>')+(d.players.length<2?'<span class="vs">vs</span><div class="pl wait"><i style="--h:250">?</i><b>Waiting…</b></div>':"");
    fx(d,myIdx);
    $("status").textContent=d.players.length<2?"Waiting for your partner to join… share the code "+code:g.status(d.state,ctx);
    if(d.players.length<2){$("stage").innerHTML="";return}
    g.render($("stage"),d.state,ctx);
    if(d.state.win!==null&&d.state.win!=="draw"&&d.state.win===myIdx){if(!celebrated){celebrated=true;burst()}}else if(d.state.win===null)celebrated=false;

const SFX=(()=>{let c=null,on=store.get("arcade-mute")!=="1";
 const ac=()=>{if(!c){try{c=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(c&&c.state==="suspended")c.resume();return c};
 const tone=(f,t,d,type,v,sl)=>{const a=ac();if(!a||!on)return;const o=a.createOscillator(),g=a.createGain(),n=a.currentTime+t;o.type=type;o.frequency.setValueAtTime(f,n);if(sl)o.frequency.exponentialRampToValueAtTime(sl,n+d);g.gain.setValueAtTime(0,n);g.gain.linearRampToValueAtTime(v,n+.01);g.gain.exponentialRampToValueAtTime(.0001,n+d);o.connect(g);g.connect(a.destination);o.start(n);o.stop(n+d+.05)};
 const seq=(arr,type,v)=>arr.forEach(x=>tone(x[0],x[1],x[2],type,v));
 const S={tap:()=>tone(520,0,.06,"triangle",.08),pop:()=>tone(660,0,.09,"sine",.15,990),good:()=>seq([[523,0,.12],[659,.1,.12],[784,.2,.2]],"triangle",.16),bad:()=>tone(220,0,.25,"sawtooth",.1,110),turn:()=>seq([[880,0,.1],[1175,.1,.16]],"sine",.12),up:()=>tone(400,0,.18,"triangle",.15,800),down:()=>tone(800,0,.18,"triangle",.15,400),reveal:()=>seq([[392,0,.1],[494,.08,.1],[587,.16,.14]],"sine",.13),horn:()=>seq([[330,0,.18],[262,.16,.3]],"square",.07),join:()=>seq([[660,0,.1],[880,.1,.18]],"sine",.14),win:()=>seq([[523,0,.15],[659,.13,.15],[784,.26,.15],[1047,.39,.35]],"triangle",.18),lose:()=>seq([[392,0,.2],[330,.18,.2],[262,.36,.4]],"sine",.14)};
 return{play(n){try{S[n]&&S[n]()}catch(e){}},toggle(){on=!on;store.set("arcade-mute",on?"0":"1");if(on)S.tap();return on},get on(){return on},unlock:ac,ctx:()=>c}})();
function shake(){const k=document.querySelector("#room .card");if(!k)return;k.classList.remove("shake");void k.offsetWidth;k.classList.add("shake")}
function fx(d,me){const p=prevD,s=d.state;prevD=d;if(!p||p.game!==d.game)return;const q=p.state;
 if(p.players.length<2&&d.players.length>=2)SFX.play("join");
 if(s.win!=null&&q.win==null){SFX.play(s.win==="draw"?"reveal":s.win===me?"win":"lose");return}
 if(d.game==="ttt"&&s.b.filter(Boolean).length>q.b.filter(Boolean).length)SFX.play("pop");

 if(d.game==="wc"&&s.last&&JSON.stringify(s.last)!==JSON.stringify(q.last||null)){const L=s.last;SFX.play(L.t==="hint"?"reveal":L.ok?"good":"bad");if(L.t==="guess"&&!L.ok&&L.p===me)shake()}

}
document.addEventListener("pointerdown",()=>SFX.unlock(),{once:true});
document.addEventListener("click",e=>{const b=e.target.closest&&e.target.closest("button");if(b&&!b.classList.contains("cell")&&b.id!=="mute")SFX.play("tap")});

const ICON_ON='<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>',ICON_OFF='<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M22 9l-6 6M16 9l6 6"/></svg>';
function paintMute(){$("mute").innerHTML=SFX.on?ICON_ON:ICON_OFF}
paintMute();
$("mute").onclick=()=>{SFX.toggle();paintMute()};
let sil=null;
function unmuteIOS(){
  try{if(navigator.audioSession)navigator.audioSession.type="playback"}catch(e){}
  if(sil)return;
  try{const n=4000,b=new Uint8Array(44+n),dv=new DataView(b.buffer),w=(o,t)=>{for(let i=0;i<t.length;i++)b[o+i]=t.charCodeAt(i)};
    w(0,"RIFF");dv.setUint32(4,36+n,true);w(8,"WAVEfmt ");dv.setUint32(16,16,true);dv.setUint16(20,1,true);dv.setUint16(22,1,true);dv.setUint32(24,8000,true);dv.setUint32(28,8000,true);dv.setUint16(32,1,true);dv.setUint16(34,8,true);w(36,"data");dv.setUint32(40,n,true);b.fill(128,44);
    sil=new Audio(URL.createObjectURL(new Blob([b],{type:"audio/wav"})));sil.loop=true;sil.play().catch(()=>{sil=null})}catch(e){sil=null}
}
const startAudio=()=>{unmuteIOS();SFX.unlock()};
["click","touchend"].forEach(ev=>document.addEventListener(ev,startAudio,{passive:true}));
document.addEventListener("visibilitychange",()=>{const a=SFX.ctx();if(!a)return;if(document.hidden)a.suspend();else if(SFX.on)a.resume()});
</script>
